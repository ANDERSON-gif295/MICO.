// SETTINGS MODAL
// =========================================================
function SettingsModal() {
  const {user, updateUser, setModal, logout, addToast} = useApp();
  const [tab, setTab] = useState('profile');
  const [phoneCode, setPhoneCode] = useState('+1');
  const [form, setForm] = useState({
    firstName: user?.firstName||'', lastName: user?.lastName||'',
    email: user?.email||'', phone: user?.phone||'',
    country: user?.country||'United States', bio: user?.bio||'',
    currentPassword:'', newPassword:'', confirmNew:'',
    payoutMethod:'', payoutDetails:'',
    notifEmail: true, notifPush: true, notifSms: false,
  });
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const saveProfile = () => { updateUser({firstName:form.firstName,lastName:form.lastName,phone:form.phone,country:form.country,bio:form.bio}); addToast('Profile updated! ✓'); };
  const savePassword = () => {
    if (hashPassword(form.currentPassword) !== user.passwordHash) { addToast('Current password incorrect','error'); return; }
    if (form.newPassword.length < 8) { addToast('Password too short','error'); return; }
    if (form.newPassword !== form.confirmNew) { addToast('Passwords do not match','error'); return; }
    updateUser({passwordHash: hashPassword(form.newPassword)});
    set('currentPassword',''); set('newPassword',''); set('confirmNew','');
    addToast('Password updated! 🔐');
  };

  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setModal(null);}}>
      <div className="modal modal-wide">
        <button className="modal-close" onClick={()=>setModal(null)}>✕</button>
        <div className="modal-title">Account Settings</div>
        <div className="modal-sub">{user?.email}</div>
        <div style={{display:'flex',marginBottom:'2rem',borderBottom:'1px solid var(--border)'}}>
          {['profile','security','payments','notifications'].map(t=>(
            <button key={t} className={`auth-tab ${tab===t?'active':''}`} onClick={()=>setTab(t)} style={{flex:'none',padding:'0.7rem 1.1rem',textTransform:'capitalize'}}>{t}</button>
          ))}
        </div>
        {tab==='profile' && (
          <>
            <div style={{display:'flex',alignItems:'center',gap:'1.5rem',marginBottom:'2rem'}}>
              <div className="nav-avatar" style={{width:72,height:72,fontSize:'1.8rem',flexShrink:0}}>{user?.firstName?.[0]||'?'}</div>
              <div><div style={{fontFamily:'var(--cinzel)',fontSize:'1.1rem',color:'var(--copper-light)'}}>{user?.firstName} {user?.lastName}</div><div style={{fontSize:'0.72rem',color:'var(--text-dim)',marginTop:'0.2rem'}}>{user?.country} · Member since {fmtDate(user?.created)}</div><StarRating rating={user?.rating||5} count={user?.ratingCount||0} /></div>
            </div>
            <div className="form-row">
              <div className="input-group"><label className="input-label">First Name</label><input className="input-field" value={form.firstName} onChange={e=>set('firstName',e.target.value)} /></div>
              <div className="input-group"><label className="input-label">Last Name</label><input className="input-field" value={form.lastName} onChange={e=>set('lastName',e.target.value)} /></div>
            </div>
            <div className="input-group"><label className="input-label">Email (read-only)</label><input className="input-field" value={form.email} disabled style={{opacity:0.6}} /></div>
            <div className="input-group"><label className="input-label">Phone Number</label><PhonePicker value={form.phone} onChange={v=>set('phone',v)} countryCode={phoneCode} onCountryCodeChange={setPhoneCode} /></div>
            <div className="input-group"><label className="input-label">Country</label><select className="input-field" value={form.country} onChange={e=>set('country',e.target.value)}>{COUNTRIES.map(c=><option key={c}>{c}</option>)}</select></div>
            <div className="input-group"><label className="input-label">Bio</label><textarea className="input-field" rows={3} placeholder="Tell buyers about yourself, what you sell, your expertise..." value={form.bio} onChange={e=>set('bio',e.target.value)} /></div>
            <div style={{display:'flex',gap:'0.8rem'}}>
              <button className="btn btn-primary" onClick={saveProfile}>Save Changes</button>
              <button className="btn btn-danger btn-sm" onClick={logout}>Sign Out</button>
            </div>
          </>
        )}
        {tab==='security' && (
          <>
            <div className="input-group"><label className="input-label">Current Password</label><input className="input-field" type="password" placeholder="Enter current password" value={form.currentPassword} onChange={e=>set('currentPassword',e.target.value)} /></div>
            <div className="input-group"><label className="input-label">New Password</label><input className="input-field" type="password" placeholder="Minimum 8 characters" value={form.newPassword} onChange={e=>set('newPassword',e.target.value)} /></div>
            <div className="input-group"><label className="input-label">Confirm New Password</label><input className="input-field" type="password" placeholder="Repeat new password" value={form.confirmNew} onChange={e=>set('confirmNew',e.target.value)} /></div>
            <button className="btn btn-primary" onClick={savePassword}>Update Password 🔐</button>
          </>
        )}
        {tab==='payments' && (
          <>
            <div style={{fontSize:'0.82rem',color:'var(--text-muted)',marginBottom:'1.2rem'}}>Set up where you receive your sales earnings (after 15% commission deduction).</div>
            {['Bank Transfer','PayPal','Mobile Money','Cryptocurrency'].map(m=>(
              <div key={m} className={`payment-option ${form.payoutMethod===m?'selected':''}`} style={{marginBottom:'0.6rem'}} onClick={()=>set('payoutMethod',m)}>
                <span className="payment-icon">{m==='Bank Transfer'?'🏛️':m==='PayPal'?'🅿️':m==='Mobile Money'?'📱':'₿'}</span>
                <div className="payment-name">{m}</div>
                {form.payoutMethod===m&&<span style={{marginLeft:'auto',color:'var(--copper-glow)'}}>✓</span>}
              </div>
            ))}
            {form.payoutMethod && <div className="input-group"><label className="input-label">Payout Account Details</label><input className="input-field" placeholder="Account number, email, or wallet address..." value={form.payoutDetails} onChange={e=>set('payoutDetails',e.target.value)} /></div>}
            <button className="btn btn-primary btn-sm" onClick={()=>addToast('Payout settings saved!')}>Save Payout Settings</button>
          </>
        )}
        {tab==='notifications' && (
          <>
            {[['notifEmail','📧','Email Notifications','Receive emails for orders, bids & messages'],['notifPush','🔔','Push Notifications','Browser notifications for real-time updates'],['notifSms','📱','SMS Notifications','Text messages for critical order updates']].map(([key,icon,name,sub])=>(
              <div key={key} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'1rem',border:'1px solid var(--border)',marginBottom:'0.6rem',background:'rgba(255,255,255,0.02)'}}>
                <div style={{display:'flex',gap:'0.8rem',alignItems:'center'}}>
                  <span style={{fontSize:'1.2rem'}}>{icon}</span>
                  <div><div style={{fontSize:'0.85rem'}}>{name}</div><div style={{fontSize:'0.72rem',color:'var(--text-dim)'}}>{sub}</div></div>
                </div>
                <div onClick={()=>set(key,!form[key])} style={{width:44,height:24,background:form[key]?'var(--copper)':'rgba(255,255,255,0.1)',borderRadius:12,cursor:'pointer',position:'relative',transition:'background 0.3s'}}>
                  <div style={{position:'absolute',top:3,left:form[key]?21:3,width:18,height:18,borderRadius:'50%',background:'white',transition:'left 0.3s'}} />
                </div>
              </div>
            ))}
            <button className="btn btn-primary btn-sm" style={{marginTop:'1rem'}} onClick={()=>addToast('Notification preferences saved!')}>Save Preferences</button>
          </>
        )}
      </div>
    </div>
  );
}

// NAVBAR
// =========================================================
function Navbar() {
  const {user, setModal, page, setPage, searchQuery, setSearchQuery, showDropdown, setShowDropdown, showNotifs, setShowNotifs, notifications, unreadNotifCount, markNotifRead, logout, cart, showCart, setShowCart, receivedOffers} = useApp();
  const dropRef = useRef();
  const notifRef = useRef();
  const [localSearch, setLocalSearch] = useState(searchQuery);

  useEffect(() => {
    const h = e => {
      if (dropRef.current && !dropRef.current.contains(e.target)) setShowDropdown(false);
      if (notifRef.current && !notifRef.current.contains(e.target)) setShowNotifs(false);
    };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  const doSearch = () => { setSearchQuery(localSearch); setPage('home'); };

  return (
    <nav className="navbar">
      <div className="nav-left">
        <div onClick={()=>{setPage('home');setSearchQuery('');setLocalSearch('');}} className="nav-logo">
          <div className="logo-text">MICO</div>
          <div className="logo-sub">Global Marketplace</div>
        </div>
        <div className="nav-search">
          <span style={{color:'var(--text-muted)',fontSize:'0.85rem'}}>🔍</span>
          <input
            placeholder="Search for anything..."
            value={localSearch}
            onChange={e=>setLocalSearch(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter')doSearch();}}
          />
          {localSearch && <span style={{cursor:'pointer',color:'var(--text-dim)',fontSize:'0.8rem'}} onClick={()=>{setLocalSearch('');setSearchQuery('');}}>✕</span>}
          <button className="nav-search-btn" onClick={doSearch}>Search</button>
        </div>
      </div>
      <div className="nav-right">
        {user ? (
          <>
            <button className={`nav-link ${page==='home'?'active':''}`} onClick={()=>setPage('home')}>Browse</button>
            <button className="nav-link" onClick={()=>setModal('listing')}>+ Sell</button>
            <button className={`nav-link ${page==='dashboard'?'active':''}`} onClick={()=>setPage('dashboard')}>Dashboard</button>

            {/* Cart button */}
            <button className="cart-btn" onClick={()=>setShowCart(true)}>
              🛒 Cart {cart.length>0 && <span className="cart-count">{cart.length}</span>}
            </button>

            {/* Notifications */}
            <div style={{position:'relative'}} ref={notifRef}>
              <button className="notif-btn" onClick={()=>{setShowNotifs(!showNotifs);if(!showNotifs)markNotifRead();}}>
                🔔
                {unreadNotifCount > 0 && <span className="notif-dot" />}
              </button>
              {showNotifs && (
                <div className="notif-panel">
                  <div className="notif-header">
                    <span>Notifications</span>
                    <span style={{fontSize:'0.7rem',color:'var(--text-dim)'}}>{notifications.length} total</span>
                  </div>
                  {receivedOffers.length > 0 && (
                    <div style={{padding:'0.7rem 1.2rem',background:'rgba(66,153,225,0.08)',borderBottom:'1px solid var(--border)',cursor:'pointer'}} onClick={()=>{setPage('offers');setShowNotifs(false);}}>
                      <div style={{fontSize:'0.78rem',color:'#90CDF4'}}>💬 {receivedOffers.length} pending offer{receivedOffers.length!==1?'s':''} — tap to review</div>
                    </div>
                  )}
                  {notifications.length === 0
                    ? <div style={{padding:'2rem',textAlign:'center',color:'var(--text-dim)',fontSize:'0.8rem'}}>No notifications yet</div>
                    : notifications.slice(0,10).map(n=>(
                      <div key={n.id} className={`notif-item ${n.read?'':'unread'}`}>
                        <div className="notif-title">{n.icon || '🔔'} {n.title}</div>
                        <div className="notif-sub">{n.sub} · {fmtTime(n.ts)}</div>
                      </div>
                    ))
                  }
                </div>
              )}
            </div>

            {/* Avatar + Dropdown */}
            <div style={{position:'relative'}} ref={dropRef}>
              <div className="nav-avatar" onClick={()=>setShowDropdown(!showDropdown)}>{user.firstName?.[0]?.toUpperCase()||'?'}</div>
              {showDropdown && (
                <div className="dropdown">
                  <div style={{padding:'0.8rem 1.2rem',borderBottom:'1px solid var(--border)'}}>
                    <div style={{fontFamily:'var(--cinzel)',fontSize:'0.85rem',color:'var(--copper-light)'}}>{user.firstName} {user.lastName}</div>
                    <div style={{fontSize:'0.7rem',color:'var(--text-dim)'}}>{user.email}</div>
                    <StarRating rating={user.rating||5} count={user.ratingCount||0} size="0.7rem" />
                  </div>
                  <button className="dropdown-item" onClick={()=>{setPage('dashboard');setShowDropdown(false);}}>📊 Dashboard</button>
                  <button className="dropdown-item" onClick={()=>{setPage('mylistings');setShowDropdown(false);}}>🏷️ My Listings</button>
                  <button className="dropdown-item" onClick={()=>{setPage('orders');setShowDropdown(false);}}>📦 My Orders</button>
                  <button className="dropdown-item" onClick={()=>{setPage('sales');setShowDropdown(false);}}>💰 My Sales</button>
                  <button className="dropdown-item" onClick={()=>{setPage('watchlist');setShowDropdown(false);}}>★ Watchlist</button>
                  <button className="dropdown-item" onClick={()=>{setPage('messages');setShowDropdown(false);}}>✉ Messages</button>
                  <button className="dropdown-item" onClick={()=>{setPage('offers');setShowDropdown(false);}}>💬 Offers {receivedOffers.length>0&&<span className="cart-count" style={{marginLeft:'auto'}}>{receivedOffers.length}</span>}</button>
                  {user?.isAdmin && <><div className="dropdown-divider"/><button className="dropdown-item" style={{color:'var(--copper-glow)'}} onClick={()=>{setPage('admin');setShowDropdown(false);}}>⚙️ Admin Panel</button></>}
                  <div className="dropdown-divider" />
                  <button className="dropdown-item" onClick={()=>{setModal('settings');setShowDropdown(false);}}>⚙ Settings</button>
                  <button className="dropdown-item" style={{color:'#FC8181'}} onClick={()=>{logout();setShowDropdown(false);}}>↩ Sign Out</button>
                </div>
              )}
            </div>
          </>
        ) : (
          <>
            <button className="nav-link" onClick={()=>setPage('home')}>Browse</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>setModal('auth')}>Sign In</button>
            <button className="btn btn-primary btn-sm" onClick={()=>setModal('auth')}>Register Free</button>
          </>
        )}
      </div>
    </nav>
  );
}

function OrdersPage() {
  const {myOrders, leaveReview, reviews, user} = useApp();
  const [reviewOrder, setReviewOrder] = useState(null);
  const [rating, setRating] = useState(5);
  const [comment, setComment] = useState('');

  const submitReview = () => {
    if (!reviewOrder) return;
    leaveReview(reviewOrder.id, reviewOrder.sellerId, rating, comment);
    setReviewOrder(null); setComment('');
  };

  const hasReviewed = (orderId) => reviews.some(r => r.orderId === orderId && r.reviewerId === user?.id);

  return (
    <div className="main">
      <div style={{fontFamily:'var(--cinzel)',fontSize:'1.5rem',color:'var(--copper-light)',marginBottom:'2rem'}}>My Orders ({myOrders.length})</div>

      {reviewOrder && (
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setReviewOrder(null);}}>
          <div className="modal" style={{maxWidth:480}}>
            <button className="modal-close" onClick={()=>setReviewOrder(null)}>✕</button>
            <div className="modal-title">Leave a Review</div>
            <div className="modal-sub">For order: {reviewOrder.id}</div>
            <div className="input-group">
              <label className="input-label">Star Rating</label>
              <div style={{display:'flex',gap:'0.5rem',fontSize:'2rem'}}>
                {[1,2,3,4,5].map(s=>(
                  <span key={s} style={{cursor:'pointer',color:s<=rating?'var(--copper-glow)':'var(--text-dim)'}} onClick={()=>setRating(s)}>★</span>
                ))}
              </div>
            </div>
            <div className="input-group"><label className="input-label">Your Review</label><textarea className="input-field" rows={4} placeholder="Share your experience with this seller and item..." value={comment} onChange={e=>setComment(e.target.value)} /></div>
            <button className="btn btn-primary" style={{width:'100%'}} onClick={submitReview}>Submit Review ⭐</button>
          </div>
        </div>
      )}

      {myOrders.length === 0 ? (
        <div style={{textAlign:'center',padding:'4rem',color:'var(--text-dim)'}}>
          <div style={{fontSize:'3rem',marginBottom:'1rem'}}>📦</div>
          <div>No orders yet. Browse and make your first purchase!</div>
        </div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:'1.2rem'}}>
          {myOrders.map(o=>(
            <div key={o.id} className="card">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:'1rem',marginBottom:'1rem'}}>
                <div>
                  <div style={{fontFamily:'var(--cinzel)',fontSize:'0.78rem',color:'var(--copper-light)',marginBottom:'0.5rem'}}>Order {o.id}</div>
                  <div style={{fontSize:'0.92rem',marginBottom:'0.3rem',color:'var(--text)'}}>{o.listingTitle}</div>
                  <div style={{fontSize:'0.75rem',color:'var(--text-dim)'}}>Seller: <span style={{color:'var(--copper-light)'}}>{o.sellerName}</span> · {fmtDate(o.ts)}</div>
                  <div style={{fontSize:'0.72rem',color:'var(--text-muted)',marginTop:'0.3rem'}}>📍 Tracking: <span style={{color:'var(--copper-light)',fontFamily:'var(--cinzel)',fontSize:'0.7rem'}}>{o.tracking}</span></div>
                  {o.estimatedDelivery && <div style={{fontSize:'0.72rem',color:'var(--success)',marginTop:'0.2rem'}}>📅 Est. delivery: {o.estimatedDelivery}</div>}
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontFamily:'var(--cinzel)',fontSize:'1.4rem',color:'var(--copper-glow)',marginBottom:'0.5rem'}}>{fmt(o.amount, o.currency)}</div>
                  <span className="badge badge-success">✓ {o.status}</span>
                  <div style={{fontSize:'0.7rem',color:'var(--text-dim)',marginTop:'0.3rem'}}>via {o.paymentMethod}</div>
                </div>
              </div>
              {/* Order Progress Steps */}
              <div className="order-steps" style={{marginBottom:'1rem'}}>
                {(o.statusSteps||['Ordered','Confirmed','Processing','Shipped','Delivered']).map((s,i)=>(
                  <div key={s} className={`order-step ${i<=(o.currentStep||1)?'done':i===(o.currentStep||1)+1?'active':''}`}>
                    <div className="order-step-dot">{i<=(o.currentStep||1)?'✓':i+1}</div>
                    <div className="order-step-label">{s}</div>
                  </div>
                ))}
              </div>
              {!hasReviewed(o.id) && (
                <button className="btn btn-ghost btn-xs" onClick={()=>setReviewOrder(o)}>⭐ Leave Review</button>
              )}
              {hasReviewed(o.id) && <span style={{fontSize:'0.7rem',color:'var(--success)'}}>✓ Review submitted</span>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// =========================================================
// MESSAGES PAGE
// =========================================================
function MessagesPage() {
  const {user, messages, setMessages, sendMessage, addToast, listings} = useApp();
  const [selected, setSelected] = useState(null);
  const [reply, setReply] = useState('');
  const msgEndRef = useRef();

  const threads = useMemo(() => messages.reduce((acc, m) => {
    const otherId = m.senderId===user?.id ? m.receiverId : m.senderId;
    const otherName = m.senderId===user?.id ? m.receiverName : m.senderName;
    if (!acc[otherId]) acc[otherId] = {otherId, otherName, messages:[]};
    acc[otherId].messages.push(m);
    return acc;
  }, {}), [messages, user]);

  useEffect(()=>{ msgEndRef.current?.scrollIntoView({behavior:'smooth'}); }, [selected, messages]);

  const doSend = () => {
    if (!reply.trim() || !selected) return;
    const msg = {id:uid(), senderId:user.id, senderName:`${user.firstName} ${user.lastName}`, receiverId:selected.otherId, receiverName:selected.otherName, text:reply, ts:Date.now()};
    const updated = [...messages, msg];
    setMessages(updated);
    DB.saveMessages(updated);
    setReply('');
    // Update selected thread
    setSelected(t => t ? {...t, messages:[...t.messages, msg]} : t);
  };

  return (
    <div className="main">
      <div style={{fontFamily:'var(--cinzel)',fontSize:'1.5rem',color:'var(--copper-light)',marginBottom:'2rem'}}>Messages</div>
      {messages.length === 0 && Object.keys(threads).length === 0 ? (
        <div style={{textAlign:'center',padding:'4rem',color:'var(--text-dim)'}}>
          <div style={{fontSize:'3rem',marginBottom:'1rem'}}>✉</div>
          <div>No messages yet. Contact a seller from any listing page!</div>
        </div>
      ) : (
        <div style={{display:'grid',gridTemplateColumns:'280px 1fr',gap:'1rem',height:'65vh'}}>
          <div style={{background:'rgba(255,255,255,0.02)',border:'1px solid var(--border)',overflow:'auto'}}>
            {Object.values(threads).length === 0
              ? <div style={{padding:'2rem',textAlign:'center',color:'var(--text-dim)',fontSize:'0.8rem'}}>No messages yet</div>
              : Object.values(threads).map(t=>(
              <div key={t.otherId} onClick={()=>setSelected(t)} style={{padding:'1rem',borderBottom:'1px solid var(--border)',cursor:'pointer',background:selected?.otherId===t.otherId?'rgba(46,139,87,0.1)':'transparent',borderLeft:selected?.otherId===t.otherId?'3px solid var(--copper)':'3px solid transparent'}}>
                <div style={{display:'flex',alignItems:'center',gap:'0.6rem',marginBottom:'0.3rem'}}>
                  <div className="nav-avatar" style={{width:28,height:28,fontSize:'0.7rem',flexShrink:0}}>{t.otherName[0]}</div>
                  <span style={{fontWeight:400,fontSize:'0.85rem'}}>{t.otherName}</span>
                </div>
                <div style={{fontSize:'0.7rem',color:'var(--text-dim)',overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis',paddingLeft:'34px'}}>{t.messages[t.messages.length-1]?.text}</div>
                <div style={{fontSize:'0.62rem',color:'var(--text-dim)',paddingLeft:'34px',marginTop:'0.2rem'}}>{fmtTime(t.messages[t.messages.length-1]?.ts)}</div>
              </div>
            ))}
          </div>
          <div style={{background:'rgba(255,255,255,0.02)',border:'1px solid var(--border)',display:'flex',flexDirection:'column'}}>
            {!selected
              ? <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text-dim)',fontSize:'0.85rem',flexDirection:'column',gap:'0.5rem'}}><span style={{fontSize:'2rem'}}>💬</span>Select a conversation</div>
              : (
              <>
                <div style={{padding:'1rem 1.2rem',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:'0.8rem'}}>
                  <div className="nav-avatar" style={{width:32,height:32,fontSize:'0.8rem'}}>{selected.otherName[0]}</div>
                  <div style={{fontFamily:'var(--cinzel)',color:'var(--copper-light)',fontSize:'0.9rem'}}>{selected.otherName}</div>
                </div>
                <div style={{flex:1,overflow:'auto',padding:'1rem',display:'flex',flexDirection:'column',gap:'0.8rem'}}>
                  {selected.messages.map(m=>(
                    <div key={m.id} style={{alignSelf:m.senderId===user?.id?'flex-end':'flex-start',maxWidth:'72%'}}>
                      {m.aboutListing && <div style={{fontSize:'0.65rem',color:'var(--copper-light)',marginBottom:'0.3rem',textAlign:m.senderId===user?.id?'right':'left'}}>Re: {m.aboutListing.title?.slice(0,35)}...</div>}
                      <div style={{background:m.senderId===user?.id?'rgba(46,139,87,0.25)':'rgba(255,255,255,0.06)',border:`1px solid ${m.senderId===user?.id?'var(--border-bright)':'var(--border)'}`,padding:'0.7rem 1rem',fontSize:'0.85rem',borderRadius:'2px',lineHeight:1.5}}>{m.text}</div>
                      <div style={{fontSize:'0.62rem',color:'var(--text-dim)',marginTop:'0.2rem',textAlign:m.senderId===user?.id?'right':'left'}}>{fmtTime(m.ts)}</div>
                    </div>
                  ))}
                  <div ref={msgEndRef} />
                </div>
                <div style={{padding:'0.8rem',borderTop:'1px solid var(--border)',display:'flex',gap:'0.5rem'}}>
                  <input className="input-field" style={{flex:1,marginBottom:0}} placeholder="Type a message..." value={reply} onChange={e=>setReply(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&doSend()} />
                  <button className="btn btn-primary btn-sm" onClick={doSend} disabled={!reply.trim()}>Send ✉</button>
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// TRACKING PAGE
// =========================================================
function TrackingPage() {
  const {orders, myOrders} = useApp();
  const [query, setQuery] = useState('');
  const [result, setResult] = useState(null);
  const [searched, setSearched] = useState(false);
  const [loading, setLoading] = useState(false);

  const allOrders = orders;

  const STEPS = ['Ordered','Payment Confirmed','Processing','Shipped','Delivered'];

  const doSearch = () => {
    if (!query.trim()) return;
    setLoading(true);
    setSearched(false);
    setTimeout(() => {
      const q = query.trim().toUpperCase();
      const found = allOrders.find(o =>
        o.id.toUpperCase() === q ||
        (o.tracking && o.tracking.toUpperCase() === q)
      );
      setResult(found || null);
      setSearched(true);
      setLoading(false);
    }, 900);
  };

  const getStepIdx = (o) => {
    const steps = o.statusSteps || STEPS;
    const idx = steps.indexOf(o.status);
    return idx >= 0 ? idx : (o.currentStep || 1);
  };

  const statusColor = (status) => {
    if (!status) return 'var(--text-muted)';
    const s = status.toLowerCase();
    if (s.includes('deliver')) return 'var(--success)';
    if (s.includes('ship')) return 'var(--copper-glow)';
    if (s.includes('process')) return 'var(--warning)';
    return 'var(--copper-light)';
  };

  return (
    <div className="main">
      <div style={{fontFamily:'var(--cinzel)',fontSize:'1.5rem',color:'var(--copper-light)',marginBottom:'0.5rem'}}>Track Your Product</div>
      <div style={{fontSize:'0.82rem',color:'var(--text-dim)',marginBottom:'2rem'}}>Enter your Order ID or Tracking Number to see live shipment status</div>

      {/* Search Box */}
      <div className="card" style={{marginBottom:'2rem',maxWidth:'620px'}}>
        <div style={{display:'flex',gap:'0.8rem',alignItems:'flex-end'}}>
          <div style={{flex:1}}>
            <label className="input-label">Order ID or Tracking Number</label>
            <input
              className="input-field"
              placeholder="e.g. AB3f8k2x1 or MICO9A3F2B1C"
              value={query}
              onChange={e=>setQuery(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&doSearch()}
            />
          </div>
          <button className="btn btn-primary" onClick={doSearch} disabled={loading} style={{whiteSpace:'nowrap',height:'46px'}}>
            {loading ? '🔍 Searching...' : '🔍 Track'}
          </button>
        </div>
        <div style={{fontSize:'0.68rem',color:'var(--text-dim)',marginTop:'0.8rem'}}>
          Your Order ID starts with <span style={{color:'var(--copper-light)',fontFamily:'var(--cinzel)'}}>AB</span> · Your Tracking Number starts with <span style={{color:'var(--copper-light)',fontFamily:'var(--cinzel)'}}>MICO</span>
        </div>
      </div>

      {/* Loading */}
      {loading && (
        <div style={{textAlign:'center',padding:'3rem',color:'var(--text-dim)'}}>
          <div className="ai-shimmer" style={{margin:'0 auto 1rem'}}></div>
          <div style={{fontSize:'0.82rem'}}>Looking up your shipment…</div>
        </div>
      )}

      {/* Not Found */}
      {searched && !loading && !result && (
        <div className="card" style={{maxWidth:'620px',textAlign:'center',padding:'3rem'}}>
          <div style={{fontSize:'3rem',marginBottom:'1rem'}}>📭</div>
          <div style={{fontFamily:'var(--cinzel)',color:'var(--copper-light)',marginBottom:'0.5rem'}}>No Shipment Found</div>
          <div style={{fontSize:'0.82rem',color:'var(--text-dim)'}}>No order or tracking number matched <strong style={{color:'var(--text)'}}>{query}</strong>.<br/>Check for typos or sign in to view your orders.</div>
        </div>
      )}

      {/* Result */}
      {searched && !loading && result && (() => {
        const steps = result.statusSteps || STEPS;
        const currentIdx = getStepIdx(result);
        return (
          <div style={{maxWidth:'680px',display:'flex',flexDirection:'column',gap:'1.2rem'}}>

            {/* Header Card */}
            <div className="card" style={{background:'linear-gradient(135deg,rgba(46,139,87,0.12),rgba(26,92,58,0.08))'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:'1rem'}}>
                <div>
                  <div style={{fontSize:'0.65rem',letterSpacing:'0.25em',textTransform:'uppercase',color:'var(--text-dim)',marginBottom:'0.4rem'}}>Order Found</div>
                  <div style={{fontFamily:'var(--cinzel)',fontSize:'1.1rem',color:'var(--copper-glow)',marginBottom:'0.3rem'}}>{result.id}</div>
                  <div style={{fontSize:'0.88rem',color:'var(--text)',marginBottom:'0.3rem'}}>{result.listingTitle}</div>
                  <div style={{fontSize:'0.72rem',color:'var(--text-dim)'}}>Seller: <span style={{color:'var(--copper-light)'}}>{result.sellerName}</span> · Ordered: {fmtDate(result.ts)}</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontFamily:'var(--cinzel)',fontSize:'1.5rem',color:'var(--copper-glow)',marginBottom:'0.4rem'}}>{fmt(result.amount,result.currency)}</div>
                  <span className="badge badge-success" style={{fontSize:'0.68rem'}}>✓ {result.status}</span>
                </div>
              </div>
            </div>

            {/* Tracking Info */}
            <div className="card">
              <div className="card-header">📦 Shipment Details</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem'}}>
                <div>
                  <div style={{fontSize:'0.62rem',letterSpacing:'0.15em',textTransform:'uppercase',color:'var(--text-dim)',marginBottom:'0.3rem'}}>Tracking Number</div>
                  <div style={{fontFamily:'var(--cinzel)',color:'var(--copper-light)',fontSize:'0.88rem',letterSpacing:'0.08em'}}>{result.tracking || '—'}</div>
                </div>
                <div>
                  <div style={{fontSize:'0.62rem',letterSpacing:'0.15em',textTransform:'uppercase',color:'var(--text-dim)',marginBottom:'0.3rem'}}>Current Status</div>
                  <div style={{color:statusColor(result.status),fontSize:'0.88rem',fontWeight:500}}>{result.status}</div>
                </div>
                <div>
                  <div style={{fontSize:'0.62rem',letterSpacing:'0.15em',textTransform:'uppercase',color:'var(--text-dim)',marginBottom:'0.3rem'}}>Est. Delivery</div>
                  <div style={{color:'var(--success)',fontSize:'0.88rem'}}>{result.estimatedDelivery || '—'}</div>
                </div>
                <div>
                  <div style={{fontSize:'0.62rem',letterSpacing:'0.15em',textTransform:'uppercase',color:'var(--text-dim)',marginBottom:'0.3rem'}}>Payment Method</div>
                  <div style={{color:'var(--text-muted)',fontSize:'0.88rem'}}>{result.paymentMethod || '—'}</div>
                </div>
                {result.shipping > 0 && (
                  <div>
                    <div style={{fontSize:'0.62rem',letterSpacing:'0.15em',textTransform:'uppercase',color:'var(--text-dim)',marginBottom:'0.3rem'}}>Shipping Cost</div>
                    <div style={{color:'var(--text-muted)',fontSize:'0.88rem'}}>{fmt(result.shipping,result.currency)}</div>
                  </div>
                )}
              </div>
            </div>

            {/* Progress Steps */}
            <div className="card">
              <div className="card-header">🚚 Shipment Progress</div>
              <div className="order-steps" style={{marginTop:'0.5rem'}}>
                {steps.map((s,i)=>(
                  <div key={s} className={`order-step ${i<=currentIdx?'done':i===currentIdx+1?'active':''}`}>
                    <div className="order-step-dot">{i<=currentIdx?'✓':i+1}</div>
                    <div className="order-step-label">{s}</div>
                  </div>
                ))}
              </div>
              {/* Timeline */}
              <div style={{marginTop:'1.5rem',borderTop:'1px solid var(--border)',paddingTop:'1rem'}}>
                {steps.slice(0,currentIdx+1).reverse().map((s,i)=>(
                  <div key={s} style={{display:'flex',gap:'1rem',alignItems:'flex-start',marginBottom:'0.8rem'}}>
                    <div style={{width:'8px',height:'8px',borderRadius:'50%',background:'var(--copper)',marginTop:'5px',flexShrink:0}}></div>
                    <div>
                      <div style={{fontSize:'0.8rem',color:'var(--text)',fontWeight:500}}>{s}</div>
                      <div style={{fontSize:'0.68rem',color:'var(--text-dim)'}}>{i===0?fmtDate(result.ts)+' — '+fmtTime(result.ts):'Completed'}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Protection badge */}
            <div className="commission-badge">
              🛡️ MICO Buyer Protection Active · Your order is covered end-to-end
            </div>
          </div>
        );
      })()}

      {/* My recent orders quick links */}
      {myOrders.length > 0 && !searched && (
        <div style={{maxWidth:'620px'}}>
          <div style={{fontSize:'0.68rem',letterSpacing:'0.2em',textTransform:'uppercase',color:'var(--text-dim)',marginBottom:'0.8rem'}}>Your Recent Orders</div>
          <div style={{display:'flex',flexDirection:'column',gap:'0.5rem'}}>
            {myOrders.slice(0,5).map(o=>(
              <div key={o.id} className="card" style={{padding:'0.8rem 1rem',cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}}
                onClick={()=>{setQuery(o.tracking||o.id);setResult(o);setSearched(true);}}>
                <div>
                  <div style={{fontFamily:'var(--cinzel)',fontSize:'0.72rem',color:'var(--copper-light)'}}>{o.id}</div>
                  <div style={{fontSize:'0.78rem',color:'var(--text)'}}>{o.listingTitle?.slice(0,40)}…</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <span className="badge badge-success" style={{fontSize:'0.6rem'}}>✓ {o.status}</span>
                  <div style={{fontSize:'0.65rem',color:'var(--text-dim)',marginTop:'0.3rem'}}>{fmtDate(o.ts)}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

                <div style={{fontFamily:'var(--cinzel)',fontSize:'1.4rem',color:'var(--copper-glow)'}}>{fmt(platformCommission)}</div>
              </div>
              <div style={{textAlign:'center',padding:'1rem',background:'rgba(46,139,87,0.08)',border:'1px solid var(--border)'}}>
                <div style={{fontSize:'0.62rem',letterSpacing:'0.2em',textTransform:'uppercase',color:'var(--text-dim)',marginBottom:'0.4rem'}}>Paid to Sellers (85%)</div>
                <div style={{fontFamily:'var(--cinzel)',fontSize:'1.4rem',color:'var(--text-muted)'}}>{fmt(totalSellerPayouts)}</div>
              </div>
            </div>
            {Object.keys(byCurrency).length > 0 && (
              <div style={{marginTop:'1rem',paddingTop:'1rem',borderTop:'1px solid var(--border)'}}>
                <div style={{fontSize:'0.68rem',color:'var(--text-dim)',marginBottom:'0.6rem',letterSpacing:'0.1em',textTransform:'uppercase'}}>By Currency</div>
                <div style={{display:'flex',gap:'1rem',flexWrap:'wrap'}}>
                  {Object.entries(byCurrency).map(([c,v])=>(
                    <div key={c} style={{background:'rgba(46,139,87,0.1)',border:'1px solid var(--border)',padding:'0.4rem 0.8rem',fontSize:'0.78rem'}}>
                      <span style={{color:'var(--text-dim)'}}>{c}: </span><span style={{color:'var(--copper-glow)',fontFamily:'var(--cinzel)'}}>{CURRENCIES[c]||'$'}{v.toFixed(2)}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* No orders yet message */}
          {allOrders.length === 0 && (
            <div style={{textAlign:'center',padding:'3rem',color:'var(--text-dim)',background:'rgba(255,255,255,0.02)',border:'1px solid var(--border)'}}>
              <div style={{fontSize:'3rem',marginBottom:'1rem'}}>📭</div>
              <div style={{fontFamily:'var(--cinzel)',color:'var(--copper-light)',marginBottom:'0.5rem'}}>No transactions yet</div>
              <div style={{fontSize:'0.82rem'}}>When buyers complete purchases, your 15% commission will appear here.</div>
            </div>
          )}
        </>
      )}

      {tab === 'transactions' && (
        <div className="card">
          <div className="card-header">💳 All Transactions ({allOrders.length})</div>
          {allOrders.length === 0 ? (
            <div style={{textAlign:'center',padding:'2rem',color:'var(--text-dim)',fontSize:'0.82rem'}}>No transactions yet.</div>
          ) : (
            <div className="table-wrap">
              <table>
                <thead><tr><th>Order ID</th><th>Item</th><th>Buyer</th><th>Seller</th><th>Sale Price</th><th>Your 15%</th><th>Seller 85%</th><th>Method</th><th>Date</th></tr></thead>
                <tbody>
                  {recentTxns.map(o=>(
                    <tr key={o.id}>
                      <td style={{fontFamily:'var(--cinzel)',fontSize:'0.7rem',color:'var(--copper-light)'}}>{o.id}</td>
                      <td style={{maxWidth:'180px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{o.listingTitle}</td>
                      <td style={{color:'var(--text-muted)'}}>{o.buyerName}</td>
                      <td style={{color:'var(--copper-light)'}}>{o.sellerName}</td>
                      <td style={{fontFamily:'var(--cinzel)',color:'var(--text)'}}>{fmt(o.amount,o.currency)}</td>
                      <td style={{fontFamily:'var(--cinzel)',color:'var(--copper-glow)',fontWeight:700}}>{fmt(o.commission,o.currency)}</td>
                      <td style={{color:'var(--text-muted)'}}>{fmt(o.sellerPayout,o.currency)}</td>
                      <td><span className="badge badge-info">{o.paymentMethod}</span></td>
                      <td style={{color:'var(--text-dim)',fontSize:'0.72rem'}}>{fmtDate(o.ts)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {tab === 'users' && (
        <div className="card">
          <div className="card-header">👥 All Registered Users ({users.length})</div>
          {users.length === 0 ? (
            <div style={{textAlign:'center',padding:'2rem',color:'var(--text-dim)',fontSize:'0.82rem'}}>No users registered yet.</div>
          ) : (
            <div className="table-wrap">
              <table>
                <thead><tr><th>Name</th><th>Email</th><th>Country</th><th>Phone</th><th>Rating</th><th>Joined</th></tr></thead>
                <tbody>
                  {users.map(u=>(
                    <tr key={u.id}>
                      <td style={{color:'var(--text)'}}>{u.firstName} {u.lastName} {u.isAdmin&&<span className="badge badge-copper" style={{marginLeft:'0.4rem'}}>Owner</span>}</td>
                      <td style={{color:'var(--copper-light)',fontSize:'0.78rem'}}>{u.email}</td>
                      <td style={{color:'var(--text-muted)'}}>{u.country}</td>
                      <td style={{color:'var(--text-dim)',fontSize:'0.72rem'}}>{u.phone}</td>
                      <td style={{color:'var(--copper-glow)'}}>{u.rating?.toFixed(1)} ★</td>
                      <td style={{color:'var(--text-dim)',fontSize:'0.72rem'}}>{fmtDate(u.created)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {tab === 'listings' && (
        <div className="card">
          <div className="card-header">🏷️ All Listings ({allListings.length})</div>
          {allListings.length === 0 ? (
            <div style={{textAlign:'center',padding:'2rem',color:'var(--text-dim)',fontSize:'0.82rem'}}>No listings yet.</div>
          ) : (
            <div className="table-wrap">
              <table>
                <thead><tr><th>Title</th><th>Seller</th><th>Category</th><th>Price</th><th>Type</th><th>Status</th><th>Listed</th></tr></thead>
                <tbody>
                  {allListings.map(l=>(
                    <tr key={l.id}>
                      <td style={{color:'var(--text)',maxWidth:'200px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.title}</td>
                      <td style={{color:'var(--copper-light)'}}>{l.sellerName}</td>
                      <td style={{color:'var(--text-muted)'}}>{l.category}</td>
                      <td style={{fontFamily:'var(--cinzel)',color:'var(--copper-glow)'}}>{fmt(l.price,l.currency)}</td>
                      <td><span className="badge badge-info">{l.type}</span></td>
                      <td><span className={`badge ${l.sold?'badge-error':'badge-success'}`}>{l.sold?'Sold':'Active'}</span></td>
                      <td style={{color:'var(--text-dim)',fontSize:'0.72rem'}}>{fmtDate(l.created)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  const {page, modal, showCart} = useApp();
  const renderPage = () => {
    switch(page) {
      case 'tracking': return <TrackingPage />;
      case 'admin': return <AdminPage />;
      case 'dashboard': return <DashboardPage />;
      case 'orders': return <OrdersPage />;
      case 'watchlist': return <WatchlistPage />;
      case 'messages': return <MessagesPage />;
      case 'mylistings': return <MyListingsPage />;
      case 'sales': return <SalesPage />;
      case 'offers': return <OffersPage />;
      default: return <HomePage />;
    }
  };
  return (
    <>
      <Navbar />
      <div className="layout">
        <Sidebar />
        {renderPage()}
      </div>
      {modal === 'auth' && <AuthModal />}
      {modal === 'product' && <ProductModal />}
      {modal === 'listing' && <CreateListingModal />}
      {modal === 'settings' && <SettingsModal />}
      {showCart && <CartModal />}
      <ToastContainer />
    </>
  );
}

function Root() {
  return <AppProvider><App /></AppProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
