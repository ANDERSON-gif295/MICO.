<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MICO — Global Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Raleway:ital,wght@0,200;0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --burnt-copper: #1A5C3A;
  --copper: #2E8B57;
  --copper-light: #3DAA6E;
  --copper-glow: #5DC98A;
  --copper-pale: #C0F0D8;
  --dark: #030D07;
  --dark2: #071A0F;
  --dark3: #0A2416;
  --dark4: #0F2E1C;
  --charcoal: #1A4D2E;
  --text: #C8F0DC;
  --text-muted: #60A07A;
  --text-dim: #3D6B50;
  --border: rgba(46,139,87,0.25);
  --border-bright: rgba(46,139,87,0.6);
  --success: #4CAF50;
  --error: #e53e3e;
  --warning: #C8B400;
  --cinzel: 'Cinzel', serif;
  --raleway: 'Raleway', sans-serif;
  --glow: 0 0 20px rgba(46,139,87,0.3);
  --glow-strong: 0 0 40px rgba(46,139,87,0.5);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--dark);
  color: var(--text);
  font-family: var(--raleway);
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(26,92,58,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(46,139,87,0.1) 0%, transparent 50%);
  pointer-events: none;
}
#root { position: relative; z-index: 1; min-height: 100vh; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--dark2); }
::-webkit-scrollbar-thumb { background: var(--burnt-copper); border-radius: 3px; }
.cinzel { font-family: var(--cinzel); }
.logo-text {
  font-family: var(--cinzel);
  font-weight: 900;
  font-size: 1.8rem;
  letter-spacing: 0.15em;
  background: linear-gradient(135deg, var(--copper-light) 0%, var(--copper-glow) 40%, var(--copper) 70%, var(--burnt-copper) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 12px rgba(46,139,87,0.5));
}
.logo-sub {
  font-family: var(--cinzel);
  font-size: 0.45rem;
  letter-spacing: 0.5em;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-top: -4px;
}
button { cursor: pointer; font-family: var(--raleway); }
.btn {
  padding: 0.75rem 1.8rem;
  border: none;
  font-family: var(--raleway);
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.btn::before {
  content: '';
  position: absolute; inset: 0;
  background: rgba(255,255,255,0.1);
  transform: translateX(-100%);
  transition: transform 0.3s ease;
}
.btn:hover::before { transform: translateX(0); }
.btn-primary {
  background: linear-gradient(135deg, var(--burnt-copper), var(--copper));
  color: #fff;
  border: 1px solid var(--copper);
  box-shadow: 0 4px 15px rgba(26,92,58,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
}
.btn-primary:hover { box-shadow: 0 6px 25px rgba(26,92,58,0.6); transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.btn-outline { background: transparent; color: var(--copper-light); border: 1px solid var(--border-bright); }
.btn-outline:hover { background: rgba(46,139,87,0.15); border-color: var(--copper-light); }
.btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 0.5rem 1rem; font-size: 0.72rem; }
.btn-ghost:hover { color: var(--copper-light); border-color: var(--border-bright); }
.btn-danger { background: rgba(229,62,62,0.2); color: #fc8181; border: 1px solid rgba(229,62,62,0.4); }
.btn-danger:hover { background: rgba(229,62,62,0.35); }
.btn-success { background: rgba(76,175,80,0.2); color: #68D391; border: 1px solid rgba(76,175,80,0.4); }
.btn-success:hover { background: rgba(76,175,80,0.35); }
.btn-offer { background: linear-gradient(135deg, rgba(66,153,225,0.3), rgba(49,130,206,0.2)); color: #90CDF4; border: 1px solid rgba(66,153,225,0.5); }
.btn-offer:hover { background: rgba(66,153,225,0.4); }
.btn-sm { padding: 0.45rem 1rem; font-size: 0.7rem; }
.btn-xs { padding: 0.3rem 0.7rem; font-size: 0.65rem; }
.input-group { margin-bottom: 1.2rem; }
.input-label { display: block; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 500; }
.input-field {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.85rem 1.1rem;
  font-family: var(--raleway);
  font-size: 0.9rem;
  font-weight: 300;
  outline: none;
  transition: all 0.2s;
  border-radius: 2px;
}
.input-field:focus { border-color: var(--copper); background: rgba(46,139,87,0.05); box-shadow: 0 0 0 3px rgba(46,139,87,0.1); }
.input-field::placeholder { color: var(--text-dim); }
select.input-field option { background: var(--dark3); }
textarea.input-field { resize: vertical; min-height: 100px; }
.card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 1.5rem; transition: all 0.3s; }
.card:hover { border-color: var(--border-bright); box-shadow: var(--glow); }
.card-header { font-family: var(--cinzel); font-size: 1.1rem; color: var(--copper-light); margin-bottom: 1.2rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--border); letter-spacing: 0.1em; }
.badge { display: inline-block; padding: 0.2rem 0.6rem; font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600; border-radius: 2px; }
.badge-copper { background: rgba(46,139,87,0.25); color: var(--copper-glow); border: 1px solid var(--border-bright); }
.badge-success { background: rgba(76,175,80,0.2); color: #68D391; border: 1px solid rgba(76,175,80,0.4); }
.badge-warning { background: rgba(214,158,46,0.2); color: #F6E05E; border: 1px solid rgba(214,158,46,0.4); }
.badge-error { background: rgba(229,62,62,0.2); color: #FC8181; border: 1px solid rgba(229,62,62,0.4); }
.badge-info { background: rgba(66,153,225,0.2); color: #90CDF4; border: 1px solid rgba(66,153,225,0.4); }
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(10,7,4,0.95);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(20px);
  padding: 0 2rem;
  height: 68px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem;
}
.nav-left { display: flex; align-items: center; gap: 2rem; }
.nav-logo { text-decoration: none; cursor: pointer; }
.nav-search { display: flex; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 0.5rem 1rem; gap: 0.5rem; min-width: 340px; transition: all 0.2s; }
.nav-search:focus-within { border-color: var(--copper); box-shadow: 0 0 0 3px rgba(46,139,87,0.1); }
.nav-search input { background: none; border: none; outline: none; color: var(--text); font-family: var(--raleway); font-size: 0.85rem; width: 100%; }
.nav-search input::placeholder { color: var(--text-dim); }
.nav-search-btn { background: linear-gradient(135deg, var(--burnt-copper), var(--copper)); border: none; color: white; padding: 0.35rem 0.8rem; font-size: 0.72rem; cursor: pointer; letter-spacing: 0.08em; white-space: nowrap; }
.nav-right { display: flex; align-items: center; gap: 0.8rem; }
.nav-link { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); cursor: pointer; transition: color 0.2s; padding: 0.4rem 0.6rem; background: none; border: none; font-family: var(--raleway); font-weight: 400; }
.nav-link:hover { color: var(--copper-light); }
.nav-link.active { color: var(--copper-glow); }
.nav-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--burnt-copper), var(--copper)); display: flex; align-items: center; justify-content: center; font-family: var(--cinzel); font-size: 0.8rem; font-weight: 700; color: #fff; cursor: pointer; border: 2px solid var(--border-bright); box-shadow: var(--glow); }
.notif-btn { position: relative; background: none; border: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; padding: 0.3rem; }
.notif-dot { position: absolute; top: 0; right: 0; width: 8px; height: 8px; background: var(--copper); border-radius: 50%; border: 2px solid var(--dark); }
.cart-btn { position: relative; background: none; border: 1px solid var(--border); color: var(--text-muted); font-size: 1rem; cursor: pointer; padding: 0.3rem 0.6rem; display: flex; align-items: center; gap: 0.3rem; font-size: 0.75rem; transition: all 0.2s; }
.cart-btn:hover { border-color: var(--copper); color: var(--copper-light); }
.cart-count { background: var(--copper); color: white; border-radius: 50%; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 700; }
.layout { display: flex; padding-top: 68px; min-height: 100vh; }
.sidebar { width: 240px; flex-shrink: 0; background: rgba(0,0,0,0.3); border-right: 1px solid var(--border); padding: 1.5rem 0; position: sticky; top: 68px; height: calc(100vh - 68px); overflow-y: auto; }
.sidebar-section { margin-bottom: 1.5rem; }
.sidebar-label { font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-dim); padding: 0 1.2rem; margin-bottom: 0.5rem; font-weight: 600; }
.sidebar-item { display: flex; align-items: center; gap: 0.8rem; padding: 0.65rem 1.2rem; font-size: 0.82rem; color: var(--text-muted); cursor: pointer; transition: all 0.2s; border-left: 3px solid transparent; font-weight: 400; }
.sidebar-item:hover { color: var(--copper-light); background: rgba(46,139,87,0.08); }
.sidebar-item.active { color: var(--copper-glow); background: rgba(46,139,87,0.12); border-left-color: var(--copper); }
.sidebar-icon { font-size: 1rem; width: 20px; text-align: center; }
.main { flex: 1; padding: 2rem; overflow: hidden; }
.hero { background: linear-gradient(135deg, var(--dark3) 0%, rgba(26,92,58,0.3) 50%, var(--dark3) 100%); border: 1px solid var(--border); padding: 3rem; margin-bottom: 2rem; position: relative; overflow: hidden; }
.hero::before { content: '✦'; position: absolute; right: 2rem; top: 50%; transform: translateY(-50%); font-size: 8rem; opacity: 0.05; color: var(--copper); }
.hero::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--copper), transparent); }
.hero-tag { font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--copper); margin-bottom: 0.8rem; font-weight: 500; }
.hero-title { font-family: var(--cinzel); font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 700; line-height: 1.1; margin-bottom: 1rem; background: linear-gradient(135deg, #fff 0%, var(--copper-glow) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero-sub { font-size: 0.88rem; color: var(--text-muted); line-height: 1.7; max-width: 500px; margin-bottom: 1.5rem; }
.hero-stats { display: flex; gap: 2.5rem; }
.hero-stat-num { font-family: var(--cinzel); font-size: 1.5rem; color: var(--copper-light); font-weight: 700; }
.hero-stat-label { font-size: 0.68rem; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }
.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.2rem; }
.product-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); overflow: hidden; cursor: pointer; transition: all 0.3s; position: relative; }
.product-card:hover { border-color: var(--copper); box-shadow: var(--glow); transform: translateY(-3px); }
.product-img { height: 180px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); }
.product-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
.product-card:hover .product-img img { transform: scale(1.05); }
.product-watch { position: absolute; top: 0.6rem; right: 0.6rem; background: rgba(10,7,4,0.85); border: 1px solid var(--border); color: var(--text-muted); font-size: 0.9rem; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; z-index: 2; }
.product-watch:hover, .product-watch.watching { color: var(--copper-glow); border-color: var(--copper); }
.product-info { padding: 1rem; }
.product-title { font-size: 0.82rem; font-weight: 400; margin-bottom: 0.3rem; color: var(--text); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.product-seller { font-size: 0.68rem; color: var(--copper-light); margin-bottom: 0.4rem; cursor: pointer; }
.product-seller:hover { text-decoration: underline; }
.product-price { font-family: var(--cinzel); font-size: 1.1rem; font-weight: 700; color: var(--copper-glow); margin-bottom: 0.5rem; }
.product-meta { display: flex; justify-content: space-between; align-items: center; }
.product-location { font-size: 0.65rem; color: var(--text-dim); }
.product-bids { font-size: 0.68rem; color: var(--text-muted); }
.product-timer { font-size: 0.65rem; color: var(--warning); font-weight: 500; }
.product-shipping { font-size: 0.65rem; color: var(--success); }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 0.8rem; }
.section-title { font-family: var(--cinzel); font-size: 1.1rem; color: var(--copper-light); letter-spacing: 0.1em; }
.section-title-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-bright), transparent); margin-left: 1rem; }
.cats { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.cat-pill { padding: 0.4rem 1rem; font-size: 0.72rem; border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.03); letter-spacing: 0.08em; }
.cat-pill:hover, .cat-pill.active { border-color: var(--copper); color: var(--copper-light); background: rgba(46,139,87,0.1); }
.modal-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 1rem; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--dark2); border: 1px solid var(--border-bright); padding: 2.5rem; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.8), var(--glow); animation: slideUp 0.3s ease; position: relative; }
.modal-wide { max-width: 780px; }
.modal-xl { max-width: 1020px; }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.modal-close { position: absolute; top: 1rem; right: 1rem; background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text-muted); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; font-size: 0.8rem; }
.modal-close:hover { border-color: var(--copper); color: var(--copper-light); }
.modal-title { font-family: var(--cinzel); font-size: 1.5rem; color: var(--copper-light); margin-bottom: 0.3rem; letter-spacing: 0.08em; }
.modal-sub { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 2rem; }
.auth-tabs { display: flex; gap: 0; margin-bottom: 2rem; border-bottom: 1px solid var(--border); }
.auth-tab { flex: 1; padding: 0.8rem; text-align: center; font-size: 0.78rem; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; color: var(--text-dim); font-weight: 500; background: none; border: none; transition: all 0.2s; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.auth-tab.active { color: var(--copper-light); border-bottom-color: var(--copper); }
.payment-methods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; margin-bottom: 1.5rem; }
.payment-option { border: 1px solid var(--border); padding: 0.9rem 1rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.8rem; background: rgba(255,255,255,0.02); }
.payment-option:hover { border-color: var(--copper); background: rgba(46,139,87,0.05); }
.payment-option.selected { border-color: var(--copper); background: rgba(46,139,87,0.1); box-shadow: 0 0 0 1px var(--copper); }
.payment-icon { font-size: 1.5rem; width: 36px; text-align: center; }
.payment-name { font-size: 0.78rem; font-weight: 500; color: var(--text); }
.payment-sub { font-size: 0.62rem; color: var(--text-dim); }
.upload-zone { border: 2px dashed var(--border); padding: 2.5rem; text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 1.2rem; }
.upload-zone:hover { border-color: var(--copper); background: rgba(46,139,87,0.05); }
.upload-icon { font-size: 2.5rem; margin-bottom: 0.8rem; opacity: 0.5; }
.upload-text { font-size: 0.8rem; color: var(--text-muted); }
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
.stat-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 1.2rem 1.5rem; transition: all 0.2s; }
.stat-card:hover { border-color: var(--border-bright); }
.stat-label { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.5rem; }
.stat-value { font-family: var(--cinzel); font-size: 1.6rem; font-weight: 700; color: var(--copper-light); }
.stat-change { font-size: 0.7rem; color: var(--success); margin-top: 0.3rem; }
.stat-icon { float: right; font-size: 1.5rem; opacity: 0.4; }
.toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 1000; display: flex; flex-direction: column; gap: 0.8rem; pointer-events: none; }
.toast { background: var(--dark2); border: 1px solid var(--border-bright); padding: 1rem 1.5rem; display: flex; align-items: center; gap: 0.8rem; box-shadow: 0 8px 25px rgba(0,0,0,0.5); animation: toastIn 0.3s ease; pointer-events: all; max-width: 320px; min-width: 260px; }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
.toast-icon { font-size: 1.1rem; }
.toast-msg { font-size: 0.82rem; flex: 1; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); padding: 0.7rem 1rem; text-align: left; border-bottom: 1px solid var(--border); font-weight: 600; }
td { padding: 0.85rem 1rem; font-size: 0.82rem; border-bottom: 1px solid rgba(46,139,87,0.08); color: var(--text-muted); vertical-align: middle; }
tr:hover td { background: rgba(46,139,87,0.04); }
.dropdown { position: absolute; top: calc(100% + 8px); right: 0; background: var(--dark2); border: 1px solid var(--border-bright); min-width: 200px; z-index: 200; box-shadow: 0 8px 30px rgba(0,0,0,0.6); animation: slideDown 0.2s ease; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.dropdown-item { display: flex; align-items: center; gap: 0.7rem; padding: 0.75rem 1.2rem; font-size: 0.8rem; color: var(--text-muted); cursor: pointer; transition: all 0.15s; border: none; background: none; width: 100%; text-align: left; font-family: var(--raleway); }
.dropdown-item:hover { color: var(--copper-light); background: rgba(46,139,87,0.08); }
.dropdown-divider { height: 1px; background: var(--border); margin: 0.3rem 0; }
.stars { color: var(--copper-glow); letter-spacing: 0.05em; }
.commission-badge { background: linear-gradient(135deg, rgba(26,92,58,0.4), rgba(46,139,87,0.2)); border: 1px solid var(--border-bright); padding: 0.6rem 1rem; font-size: 0.75rem; color: var(--copper-glow); text-align: center; letter-spacing: 0.1em; }
.ticker { background: linear-gradient(90deg, var(--dark3), rgba(26,92,58,0.3), var(--dark3)); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 0.5rem 0; overflow: hidden; white-space: nowrap; }
.ticker-inner { display: inline-flex; gap: 4rem; animation: scroll 30s linear infinite; }
@keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.ticker-item { font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); }
.bid-row { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }

    const allBids = DB.getBids();
    const updated = {...allBids, [listingId]: [...(allBids[listingId]||[]), bidRecord]};
    DB.saveBids(updated);
    setBids(updated);
    addToast(`Bid of ${fmt(amount)} placed! You're the highest bidder 🏆`);
    addNotification('Bid Placed', `Your bid of ${fmt(amount)} is now the highest!`, '🏆');
  };

  const placeOrder = (listing, paymentMethod, paymentDetails, finalPrice) => {
    const price = finalPrice || listing.buyNow || listing.price;
    const sellerAmount = price * (1 - COMMISSION);
    const commission = price * COMMISSION;
    const order = {
      id: 'AB' + uid().toUpperCase(),
      listingId: listing.id, listingTitle: listing.title,
      listingImage: listing.imageUrl, listingCategory: listing.category,
      buyerId: user.id, buyerName: `${user.firstName} ${user.lastName}`,
      sellerId: listing.sellerId, sellerName: listing.sellerName,
      amount: price, sellerPayout: sellerAmount, commission,
      paymentMethod, paymentDetails, status: 'Payment Confirmed',
      statusSteps: ['Ordered','Payment Confirmed','Processing','Shipped','Delivered'],
      currentStep: 1,
      ts: Date.now(), tracking: 'MICO' + Math.random().toString(36).substr(2,8).toUpperCase(),
      shipping: listing.shipping, currency: listing.currency,
      estimatedDelivery: new Date(Date.now() + 86400000 * 7).toLocaleDateString('en-US',{month:'short',day:'numeric'}),
    };
    const updated = [order, ...orders];
    setOrders(updated);
    DB.saveOrders(updated);
    const updatedListings = listings.map(l => l.id === listing.id ? {...l, sold:true} : l);
    setListings(updatedListings);
    DB.saveListings(updatedListings);
    // Remove from cart if present
    const updatedCart = cart.filter(c => c.listingId !== listing.id);
    setCart(updatedCart);
    DB.saveCart(updatedCart);
    addToast('Order confirmed! Payment successful 🎉');
    addNotification('Order Confirmed', `Order ${order.id} placed successfully`, '📦');
    // Record 15% platform commission
    const pe = DB.getPlatformEarnings();
    DB.savePlatformEarnings({
      totalCommission: pe.totalCommission + commission,
      totalOrders: pe.totalOrders + 1,
      transactions: [{
        orderId: order.id, amount: price, commission, currency: listing.currency,
        buyerName: `${user.firstName} ${user.lastName}`, sellerName: listing.sellerName,
        listingTitle: listing.title, paymentMethod, ts: Date.now()
      }, ...pe.transactions].slice(0, 500)
    });
    return order;
  };

  const toggleWatch = (listingId) => {
    if (!user) { setModal('auth'); return; }
    const updated = watching.includes(listingId)
      ? watching.filter(id => id !== listingId)
      : [...watching, listingId];
    setWatching(updated);
    DB.saveWatching(updated);
    const isNowWatching = updated.includes(listingId);
    addToast(isNowWatching ? '★ Added to watchlist' : '☆ Removed from watchlist', 'info');
    if (isNowWatching) addNotification('Watchlist', 'Item added to your watchlist', '★');
    // Update watchers count
    const updatedListings = listings.map(l => {
      if (l.id === listingId) return {...l, watchers: isNowWatching ? l.watchers+1 : Math.max(0,l.watchers-1)};
      return l;
    });
    setListings(updatedListings);
    DB.saveListings(updatedListings);
  };

  const addToCart = (listing) => {
    if (!user) { setModal('auth'); return; }
    if (cart.find(c => c.listingId === listing.id)) {
      addToast('Already in cart!', 'info'); return;
    }
    const cartItem = { id: uid(), listingId: listing.id, title: listing.title, price: listing.buyNow || listing.price, currency: listing.currency, imageUrl: listing.imageUrl, sellerName: listing.sellerName, shipping: listing.shipping, ts: Date.now() };
    const updated = [...cart, cartItem];
    setCart(updated);
    DB.saveCart(updated);
    addToast('Added to cart 🛒');
    addNotification('Cart Updated', `"${listing.title.slice(0,30)}..." added to cart`, '🛒');
  };

  const removeFromCart = (cartItemId) => {
    const updated = cart.filter(c => c.id !== cartItemId);
    setCart(updated);
    DB.saveCart(updated);
    addToast('Removed from cart', 'info');
  };

  const sendMessage = (toId, toName, text, aboutListing=null) => {
    if (!user) { setModal('auth'); return; }
    const msg = {
      id: uid(), senderId: user.id, senderName: `${user.firstName} ${user.lastName}`,
      receiverId: toId, receiverName: toName, text, ts: Date.now(),
      aboutListing
    };
    const updated = [...messages, msg];
    setMessages(updated);
    DB.saveMessages(updated);
    addToast('Message sent! ✉');
    addNotification('Message Sent', `Message sent to ${toName}`, '✉');
    return msg;
  };

  const makeOffer = (listing, amount) => {
    if (!user) { setModal('auth'); return; }
    const offer = {
      id: uid(), listingId: listing.id, listingTitle: listing.title,
      buyerId: user.id, buyerName: `${user.firstName} ${user.lastName}`,
      sellerId: listing.sellerId, sellerName: listing.sellerName,
      amount, status: 'pending', ts: Date.now(),
    };
    const updated = [...offers, offer];
    setOffers(updated);
    DB.saveOffers(updated);
    addToast(`Offer of ${fmt(amount, listing.currency)} sent to seller!`);
    addNotification('Offer Sent', `Your offer of ${fmt(amount, listing.currency)} was submitted`, '💬');
    return offer;
  };

  const respondToOffer = (offerId, accepted) => {
    const updated = offers.map(o => o.id === offerId ? {...o, status: accepted ? 'accepted' : 'declined'} : o);
    setOffers(updated);
    DB.saveOffers(updated);
    addToast(accepted ? 'Offer accepted!' : 'Offer declined');
    addNotification('Offer ' + (accepted ? 'Accepted' : 'Declined'), accepted ? 'The buyer will be notified' : 'Offer has been declined', accepted ? '✅' : '❌');
  };

  const leaveReview = (orderId, sellerId, rating, comment) => {
    const review = { id: uid(), orderId, sellerId, reviewerId: user.id, reviewerName: `${user.firstName} ${user.lastName}`, rating, comment, ts: Date.now() };
    const updated = [...reviews, review];
    setReviews(updated);
    DB.saveReviews(updated);
    addToast('Review submitted! Thank you 🌟');
    addNotification('Review Left', `You left a ${rating}-star review`, '⭐');
  };

  const incrementViews = useCallback((listingId) => {
    setListings(prev => {
      const updated = prev.map(l => l.id === listingId ? {...l, views: l.views+1} : l);
      DB.saveListings(updated);
      return updated;
    });
  }, []);

  const unreadNotifCount = notifications.filter(n => !n.read).length;
  const markNotifRead = () => {
    const updated = notifications.map(n => ({...n, read:true}));
    setNotifications(updated);
    DB.saveNotifications(updated);
  };

  const filteredListings = useMemo(() => {
    let result = listings.filter(l => {
      if (l.sold) return false;
      if (selectedCat !== 'All' && l.category !== selectedCat) return false;
      if (filterType === 'auction' && l.type !== 'auction') return false;
      if (filterType === 'buyNow' && l.type !== 'buyNow') return false;
      if (filterType === 'freeShip' && l.shipping !== 0) return false;
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        return l.title.toLowerCase().includes(q) || l.category.toLowerCase().includes(q) || (l.description||'').toLowerCase().includes(q) || (l.sellerName||'').toLowerCase().includes(q) || (l.location||'').toLowerCase().includes(q);
      }
      return true;
    });
    switch(sortBy) {
      case 'priceLow': result = [...result].sort((a,b) => (a.highBid||a.price) - (b.highBid||b.price)); break;
      case 'priceHigh': result = [...result].sort((a,b) => (b.highBid||b.price) - (a.highBid||a.price)); break;
      case 'newest': result = [...result].sort((a,b) => b.created - a.created); break;
      case 'mostBids': result = [...result].sort((a,b) => b.bids - a.bids); break;
      case 'mostWatched': result = [...result].sort((a,b) => b.watchers - a.watchers); break;
      default: break;
    }
    return result;
  }, [listings, selectedCat, searchQuery, sortBy, filterType]);

  const myListings = listings.filter(l => l.sellerId === user?.id);
  const myOrders = orders.filter(o => o.buyerId === user?.id);
  const mySales = orders.filter(o => o.sellerId === user?.id);
  const myOffers = offers.filter(o => o.buyerId === user?.id);
  const receivedOffers = offers.filter(o => o.sellerId === user?.id && o.status === 'pending');
  const totalRevenue = mySales.reduce((s,o) => s + o.amount, 0);
  const totalCommission = mySales.reduce((s,o) => s + o.commission, 0);
  const totalPayout = mySales.reduce((s,o) => s + o.sellerPayout, 0);
  const cartTotal = cart.reduce((s,c) => s + (c.price + (c.shipping||0)), 0);

  return (
    <AppContext.Provider value={{
      user, login, logout, updateUser,
      listings, filteredListings, myListings, addListing,
      orders, myOrders, mySales, placeOrder,
      watching, toggleWatch,
      bids, placeBid,
      cart, addToCart, removeFromCart, cartTotal,
      offers, myOffers, receivedOffers, makeOffer, respondToOffer,
      reviews, leaveReview,
      messages, setMessages, sendMessage,
      notifications, unreadNotifCount, markNotifRead, addNotification,
      toasts, addToast,
      page, setPage,
      modal, setModal,
      selectedProduct, setSelectedProduct,
      contactSeller, setContactSeller,
      searchQuery, setSearchQuery,
      selectedCat, setSelectedCat,
      sortBy, setSortBy,
      filterType, setFilterType,
      showDropdown, setShowDropdown,
      showNotifs, setShowNotifs,
      showCart, setShowCart,
      incrementViews,
      totalRevenue, totalCommission, totalPayout,
    }}>
      {children}
    </AppContext.Provider>
  );
}

function PhonePicker({value, onChange, countryCode, onCountryCodeChange}) {
  const [open, setOpen] = useState(false);
  const [search, setSearch] = useState('');
  const ref = useRef();
  useEffect(() => {
    const h = e => { if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  const filtered = COUNTRY_CODES.filter(c => c.country.toLowerCase().includes(search.toLowerCase()) || c.code.includes(search));
  const selected = COUNTRY_CODES.find(c => c.code === countryCode) || COUNTRY_CODES[94];
  return (
    <div style={{position:'relative'}} ref={ref}>
      <div className="phone-input-row">
        <button type="button" className="country-code-btn" onClick={()=>setOpen(!open)}>
          <span>{selected?.flag}</span><span style={{fontSize:'0.78rem'}}>{selected?.code}</span><span style={{fontSize:'0.6rem',opacity:0.5}}>▾</span>
        </button>
        <input className="input-field" style={{borderRadius:'0 2px 2px 0',flex:1}} placeholder="Phone number" value={value} onChange={e=>onChange(e.target.value)} />
      </div>
      {open && (
        <div className="phone-dropdown">
          <div className="phone-dd-search">
            <input className="input-field" style={{padding:'0.5rem 0.8rem',fontSize:'0.8rem'}} placeholder="Search country..." value={search} onChange={e=>setSearch(e.target.value)} autoFocus />
          </div>
          {filtered.map(c => (
            <div key={c.country+c.code} className="phone-dd-item" onClick={()=>{onCountryCodeChange(c.code);setOpen(false);setSearch('');}}>
              <span>{c.flag}</span><span style={{flex:1}}>{c.country}</span><span style={{color:'var(--copper-light)',fontSize:'0.72rem'}}>{c.code}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function StarRating({rating, count, size='0.85rem'}) {
  const r = Math.round(rating);
  return (
    <span style={{display:'inline-flex',alignItems:'center',gap:'0.3rem'}}>
      <span className="stars" style={{fontSize:size}}>{'★'.repeat(r)}{'☆'.repeat(5-r)}</span>

}

function AuthModal() {
  const {login, setModal} = useApp();
  const [tab, setTab] = useState('login');
  const [form, setForm] = useState({email:'',password:'',firstName:'',lastName:'',country:'United States',phone:'',confirmPassword:'',countryCode:'+1'});
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const handleLogin = () => {
    if (!form.email || !form.password) { setErr('Please fill all fields'); return; }
    setLoading(true);
    setTimeout(() => {
      const users = DB.getUsers();
      const u = users.find(u => u.email.toLowerCase() === form.email.toLowerCase() && u.passwordHash === hashPassword(form.password));
      if (!u) { setErr('Invalid email or password'); setLoading(false); return; }
      login(u);
      setLoading(false);
    }, 800);
  };

  const handleRegister = () => {
    if (!form.email || !form.password || !form.firstName || !form.lastName) { setErr('Please fill all required fields'); return; }
    if (form.password !== form.confirmPassword) { setErr('Passwords do not match'); return; }
    if (form.password.length < 8) { setErr('Password must be at least 8 characters'); return; }
    const users = DB.getUsers();
    if (users.find(u => u.email.toLowerCase() === form.email.toLowerCase())) { setErr('Email already registered'); return; }
    setLoading(true);
    setTimeout(() => {
      const newUser = {
        id: uid(), email: form.email, firstName: form.firstName, lastName: form.lastName,
        country: form.country, phone: form.countryCode + form.phone,
        passwordHash: hashPassword(form.password),
        created: Date.now(), rating: 5.0, ratingCount: 0,
        verified: true, seller: true,
        isAdmin: form.email.toLowerCase() === OWNER_EMAIL.toLowerCase(),
        bio: '', avatar: form.firstName[0].toUpperCase(),
      };
      DB.saveUsers([...users, newUser]);
      login(newUser);
      setLoading(false);
    }, 800);
  };

  return (
    <div className="modal-overlay" onClick={e => { if(e.target===e.currentTarget) setModal(null); }}>
      <div className="modal" style={{maxWidth:520}}>
        <button className="modal-close" onClick={() => setModal(null)}>✕</button>
        <div className="logo-text" style={{fontSize:'1.4rem',marginBottom:'0.2rem'}}>MICO</div>
        <div className="logo-sub" style={{marginBottom:'1.5rem'}}>Global Marketplace</div>
        <div className="auth-tabs">
          <button className={`auth-tab ${tab==='login'?'active':''}`} onClick={()=>{setTab('login');setErr('');}}>Sign In</button>
          <button className={`auth-tab ${tab==='register'?'active':''}`} onClick={()=>{setTab('register');setErr('');}}>Create Account</button>
        </div>
        {err && <div style={{background:'rgba(229,62,62,0.1)',border:'1px solid rgba(229,62,62,0.3)',padding:'0.7rem 1rem',color:'#FC8181',fontSize:'0.8rem',marginBottom:'1rem',display:'flex',alignItems:'center',gap:'0.5rem'}}>⚠️ {err}</div>}
        {tab === 'login' ? (
          <>
            <div className="input-group"><label className="input-label">Email Address</label><input className="input-field" type="email" placeholder="your@email.com" value={form.email} onChange={e=>set('email',e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleLogin()} /></div>
            <div className="input-group"><label className="input-label">Password</label><input className="input-field" type="password" placeholder="••••••••" value={form.password} onChange={e=>set('password',e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleLogin()} /></div>
            <div style={{textAlign:'right',marginBottom:'1.5rem'}}><span style={{fontSize:'0.75rem',color:'var(--copper-light)',cursor:'pointer'}}>Forgot password?</span></div>
            <button className="btn btn-primary" style={{width:'100%'}} onClick={handleLogin} disabled={loading}>{loading?'Signing in...':'Sign In to MICO'}</button>
            <div style={{textAlign:'center',marginTop:'1rem',fontSize:'0.72rem',color:'var(--text-dim)'}}>🔒 Sign in to unlock real product photos & full features</div>
          </>
        ) : (
          <>
            <div className="form-row">
              <div className="input-group"><label className="input-label">First Name *</label><input className="input-field" placeholder="John" value={form.firstName} onChange={e=>set('firstName',e.target.value)} /></div>
              <div className="input-group"><label className="input-label">Last Name *</label><input className="input-field" placeholder="Doe" value={form.lastName} onChange={e=>set('lastName',e.target.value)} /></div>
            </div>
            <div className="input-group"><label className="input-label">Email Address *</label><input className="input-field" type="email" placeholder="your@email.com" value={form.email} onChange={e=>set('email',e.target.value)} /></div>
            <div className="form-row">
              <div className="input-group"><label className="input-label">Password *</label><input className="input-field" type="password" placeholder="Min. 8 characters" value={form.password} onChange={e=>set('password',e.target.value)} /></div>
              <div className="input-group"><label className="input-label">Confirm Password *</label><input className="input-field" type="password" placeholder="Repeat password" value={form.confirmPassword} onChange={e=>set('confirmPassword',e.target.value)} /></div>
            </div>
            <div className="form-row">
              <div className="input-group"><label className="input-label">Country</label><select className="input-field" value={form.country} onChange={e=>set('country',e.target.value)}>{COUNTRIES.map(c=><option key={c}>{c}</option>)}</select></div>
              <div className="input-group"><label className="input-label">Phone Number</label><PhonePicker value={form.phone} onChange={v=>set('phone',v)} countryCode={form.countryCode} onCountryCodeChange={v=>set('countryCode',v)} /></div>
            </div>
            <div style={{background:'rgba(46,139,87,0.08)',border:'1px solid var(--border)',padding:'0.8rem',marginBottom:'1rem',fontSize:'0.72rem',color:'var(--copper-light)',textAlign:'center'}}>
              🖼️ Create account to unlock real seller photos & all marketplace features
            </div>
            <button className="btn btn-primary" style={{width:'100%'}} onClick={handleRegister} disabled={loading}>{loading?'Creating account...':'Create Account & Start Shopping'}</button>
          </>
        )}
      </div>
    </div>
  );
}

}

function MakeOfferModal({listing, onClose}) {
  const {user, setModal, makeOffer} = useApp();
  const [amount, setAmount] = useState('');
  const [sent, setSent] = useState(false);
  const [err, setErr] = useState('');
  if (!user) { setModal('auth'); return null; }
  const asking = listing.buyNow || listing.price;
  const handle = () => {
    const amt = parseFloat(amount);
    if (!amt || isNaN(amt)) { setErr('Please enter a valid amount'); return; }
    if (amt <= 0) { setErr('Offer must be greater than 0'); return; }
    if (amt > asking) { setErr(`Your offer is higher than the asking price (${fmt(asking, listing.currency)}). Just buy it now!`); return; }
    makeOffer(listing, amt);
    setSent(true);
  };
  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal" style={{maxWidth:480}}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <div className="modal-title">Make an Offer</div>
        <div className="modal-sub">Suggest a price to the seller</div>
        <div style={{background:'rgba(46,139,87,0.06)',border:'1px solid var(--border)',padding:'0.8rem',marginBottom:'1.2rem',display:'flex',gap:'0.8rem',alignItems:'center'}}>
          <div style={{width:48,height:48,overflow:'hidden',flexShrink:0}}><ProductImage listing={listing} height={48} /></div>
          <div><div style={{fontSize:'0.82rem'}}>{listing.title.slice(0,55)}...</div><div style={{fontSize:'0.72rem',color:'var(--text-dim)',marginTop:'0.2rem'}}>Asking: <span style={{color:'var(--copper-glow)',fontFamily:'var(--cinzel)'}}>{fmt(asking,listing.currency)}</span></div></div>
        </div>
        {sent ? (
          <div style={{textAlign:'center',padding:'2rem'}}>
            <div style={{fontSize:'3rem',marginBottom:'1rem'}}>💬</div>

        ) : (

              {asking && <div style={{fontSize:'0.7rem',color:'var(--text-dim)',marginTop:'0.4rem'}}>Asking price: {fmt(asking,listing.currency)} · Your offer: {amount ? fmt(parseFloat(amount)||0,listing.currency) : '—'} {amount && asking && parseFloat(amount) < asking ? <span style={{color:'var(--warning)'}}>({Math.round((1 - parseFloat(amount)/asking)*100)}% below asking)</span> : ''}</div>}
            </div>
            {err && <div style={{color:'var(--error)',fontSize:'0.78rem',marginBottom:'0.8rem'}}>⚠️ {err}</div>}
            <div style={{fontSize:'0.75rem',color:'var(--text-dim)',padding:'0.7rem',background:'rgba(255,255,255,0.03)',border:'1px solid var(--border)',marginBottom:'1.2rem'}}>
              📋 By making an offer, you commit to buying at this price if the seller accepts. Offers expire after 48 hours.
            </div>
            <div style={{display:'flex',gap:'0.8rem'}}>
              <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
              <button className="btn btn-primary" style={{flex:1}} onClick={handle} disabled={!amount}>Submit Offer — {amount ? fmt(parseFloat(amount)||0,listing.currency) : '—'}</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

  const [payMethod, setPayMethod] = useState('');
  const [mmProvider, setMmProvider] = useState('');
  const [phoneCode, setPhoneCode] = useState('+1');
  const [form, setForm] = useState({
    cardNumber:'', cardExpiry:'', cardCvc:'', cardName:'',
    bankName:'', accountNumber:'', sortCode:'',
    mmPhone:'', mmName:'', paypalEmail:'',
    billingAddress:'', billingCity:'', billingCountry: user?.country || 'United States',
    shippingAddress:'', shippingCity:'', shippingCountry: user?.country || 'United States',
    shippingState:'', shippingZip:'', shippingPhone: user?.phone || '', shippingRecipient:`${user?.firstName||''} ${user?.lastName||''}`.trim(),
    deliveryNote:'', landmark:'', deliveryType:'home',
  });
  const [processing, setProcessing] = useState(false);
  const [order, setOrder] = useState(null);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  if (!user) { setModal('auth'); return null; }

  const subtotal = listing.buyNow || listing.price;
  const shipping = listing.shipping || 0;
  const total = subtotal + shipping;
  const sellerGets = subtotal * (1 - COMMISSION);

  const paymentOptions = [
    { id:'credit', icon:'💳', name:'Credit Card', sub:'Visa, Mastercard, Amex' },
    { id:'debit', icon:'🏦', name:'Debit Card', sub:'Instant payment' },
    { id:'paypal', icon:'🅿️', name:'PayPal', sub:'Pay with PayPal balance' },
    { id:'googlepay', icon:'🟢', name:'Google Pay', sub:'Fast & secure' },
    { id:'applepay', icon:'🍎', name:'Apple Pay', sub:'Touch ID payment' },
    { id:'mobilemoney', icon:'📱', name:'Mobile Money', sub:'M-Pesa, MTN, Airtel+' },
    { id:'banktransfer', icon:'🏛️', name:'Bank Transfer', sub:'Direct bank payment' },
  ];
  const mmProviders = ['M-Pesa','MTN Mobile Money','Airtel Money','Orange Money','Tigo Cash','EcoCash','GhIPSS','Paga'];

  const [payErrors, setPayErrors] = useState({});

  const validatePayment = () => {
    const errs = {};
    if (!payMethod) { errs.method = 'Please select a payment method'; }
    if (payMethod === 'credit' || payMethod === 'debit') {
      if (!form.cardName.trim()) errs.cardName = 'Cardholder name required';
      if (!validateCard(form.cardNumber)) errs.cardNumber = 'Invalid card number — check digits and try again';
      if (!validateExpiry(form.cardExpiry)) errs.cardExpiry = 'Invalid or expired date (MM/YY)';
      if (!form.cardCvc || form.cardCvc.length < 3) errs.cardCvc = 'CVC must be 3–4 digits';
    }
    if (payMethod === 'paypal') {
      if (!form.paypalEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.paypalEmail)) errs.paypalEmail = 'Valid PayPal email required';
    }
    if (payMethod === 'mobilemoney') {
      if (!mmProvider) errs.mmProvider = 'Select a Mobile Money provider';
      if (!form.mmPhone || form.mmPhone.length < 5) errs.mmPhone = 'Valid phone number required';
      if (!form.mmName.trim()) errs.mmName = 'Registered account name required';
    }
    if (payMethod === 'banktransfer') {
      if (!form.bankName.trim()) errs.bankName = 'Bank name required';
      if (!form.accountNumber.trim()) errs.accountNumber = 'Account number / IBAN required';
      if (!form.sortCode.trim()) errs.sortCode = 'Sort code / SWIFT / BIC required';
    }
    return errs;
  };

  const handlePay = () => {
    const errs = validatePayment();
    setPayErrors(errs);
    if (Object.keys(errs).length > 0) return;
    setProcessing(true);
    setTimeout(() => {
      const placedOrder = placeOrder(listing, payMethod, form, subtotal);
      setOrder(placedOrder);
      setStep(3);
      setProcessing(false);
    }, 2800);
  };

  const formatCard = (v) => v.replace(/\D/g,'').replace(/(.{4})/g,'$1 ').trim().slice(0,19);
  const formatExpiry = (v) => v.replace(/\D/g,'').replace(/(\d{2})(\d)/,'$1/$2').slice(0,5);

  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget&&step<3)onClose();}}>
      <div className="modal modal-wide">
        {step < 3 && <button className="modal-close" onClick={onClose}>✕</button>}

        {/* Step indicator */}
        {step < 3 && (
          <div style={{display:'flex',gap:'0',marginBottom:'2rem',borderBottom:'1px solid var(--border)'}}>
            {['Review Order','Payment','Confirmation'].map((s,i)=>(
              <div key={s} style={{flex:1,padding:'0.6rem',textAlign:'center',fontSize:'0.7rem',letterSpacing:'0.1em',textTransform:'uppercase',color:step===i+1?'var(--copper-light)':'var(--text-dim)',borderBottom:`2px solid ${step===i+1?'var(--copper)':'transparent'}`,marginBottom:'-1px'}}>
                <span style={{marginRight:'0.4rem'}}>{step>i+1?'✓':i+1}</span>{s}
              </div>
            ))}
          </div>
        )}

        {step === 1 && (
          <>
            <div className="modal-title">Review Your Order</div>
            <div className="card" style={{marginBottom:'1.5rem',background:'rgba(46,139,87,0.04)'}}>
              <div style={{display:'flex',gap:'1.2rem',alignItems:'flex-start'}}>
                <div style={{width:80,height:80,overflow:'hidden',border:'1px solid var(--border)',flexShrink:0}}><ProductImage listing={listing} height={80} /></div>
                <div style={{flex:1}}>
                  <div style={{fontSize:'0.92rem',marginBottom:'0.4rem',lineHeight:1.4}}>{listing.title}</div>
                  <div style={{fontSize:'0.72rem',color:'var(--text-dim)'}}>Sold by: <span style={{color:'var(--copper-light)'}}>{listing.sellerName}</span> · Condition: {listing.condition}</div>
                  <div style={{fontSize:'0.7rem',color:'var(--text-dim)',marginTop:'0.3rem'}}>📍 Ships from: {listing.location}</div>
                </div>
                <div style={{fontFamily:'var(--cinzel)',fontSize:'1.3rem',color:'var(--copper-glow)',fontWeight:700,flexShrink:0}}>{fmt(subtotal,listing.currency)}</div>
              </div>
            </div>
            <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid var(--border)',padding:'1.2rem',marginBottom:'1.5rem',fontSize:'0.82rem'}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.6rem'}}><span style={{color:'var(--text-dim)'}}>Item Price</span><span>{fmt(subtotal,listing.currency)}</span></div>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.6rem'}}><span style={{color:'var(--text-dim)'}}>Shipping</span><span style={{color:shipping===0?'var(--success)':undefined}}>{shipping===0?'FREE ✓':fmt(shipping,listing.currency)}</span></div>
              <div style={{height:'1px',background:'var(--border)',margin:'0.8rem 0'}} />
              <div style={{display:'flex',justifyContent:'space-between',fontFamily:'var(--cinzel)',fontWeight:700,fontSize:'1.15rem'}}><span>Total</span><span style={{color:'var(--copper-glow)'}}>{fmt(total,listing.currency)}</span></div>
            </div>
            <div style={{background:'rgba(76,175,80,0.06)',border:'1px solid rgba(76,175,80,0.3)',padding:'0.8rem',marginBottom:'1.5rem',fontSize:'0.75rem',color:'#68D391',display:'flex',alignItems:'center',gap:'0.6rem'}}>
              🛡️ MICO Buyer Protection — Full refund if item not as described or not delivered
            </div>
            <div className="commission-badge" style={{marginBottom:'1.5rem'}}>💰 Seller receives {fmt(sellerGets,listing.currency)} after 15% MICO commission</div>

            {/* Delivery Information */}
            <div style={{border:'1px solid var(--border-bright)',padding:'1.2rem',marginBottom:'1.5rem',background:'rgba(46,139,87,0.04)'}}>
              <div style={{fontSize:'0.7rem',letterSpacing:'0.2em',textTransform:'uppercase',color:'var(--copper-light)',marginBottom:'1.2rem',display:'flex',alignItems:'center',gap:'0.5rem'}}>
                📦 Delivery Information <span style={{fontSize:'0.62rem',color:'var(--text-dim)',letterSpacing:'0.05em',textTransform:'none'}}>(required for shipping)</span>
              </div>

              {/* Delivery type selector */}
              <div style={{display:'flex',gap:'0.6rem',marginBottom:'1.2rem'}}>
                {[['home','🏠 Home'],['office','🏢 Office / Work'],['pickup','📮 Pickup Point']].map(([v,l])=>(
                  <div key={v} onClick={()=>set('deliveryType',v)} style={{flex:1,padding:'0.6rem',textAlign:'center',fontSize:'0.72rem',cursor:'pointer',border:`1px solid ${form.deliveryType===v?'var(--copper)':'var(--border)'}`,background:form.deliveryType===v?'rgba(46,139,87,0.12)':'rgba(255,255,255,0.02)',color:form.deliveryType===v?'var(--copper-light)':'var(--text-dim)',transition:'all 0.2s'}}>
                    {l}
                  </div>
                ))}
              </div>

              {/* Recipient */}
              <div className="form-row">
                <div className="input-group">
                  <label className="input-label">Recipient Full Name *</label>
                  <input className="input-field" placeholder="John Doe" value={form.shippingRecipient} onChange={e=>set('shippingRecipient',e.target.value)} />
                </div>
                <div className="input-group">
                  <label className="input-label">Recipient Phone *</label>
                  <input className="input-field" placeholder="+1 555 000 0000" value={form.shippingPhone} onChange={e=>set('shippingPhone',e.target.value)} />
                </div>
              </div>

              {/* Address */}
              <div className="input-group">
                <label className="input-label">Street Address / House No. *</label>
                <input className="input-field" placeholder="123 Main Street, Apt 4B" value={form.shippingAddress} onChange={e=>set('shippingAddress',e.target.value)} />
              </div>

              {/* Landmark */}
              <div className="input-group">
                <label className="input-label">Nearby Landmark / Note for Driver</label>
                <input className="input-field" placeholder="e.g. Next to the blue gate, opposite Shoprite, green fence" value={form.landmark} onChange={e=>set('landmark',e.target.value)} />
              </div>

              {/* City / State / ZIP */}
              <div className="form-row">
                <div className="input-group">
                  <label className="input-label">City *</label>
                  <input className="input-field" placeholder="Lusaka" value={form.shippingCity} onChange={e=>set('shippingCity',e.target.value)} />
                </div>
                <div className="input-group">
                  <label className="input-label">State / Province / Region</label>
                  <input className="input-field" placeholder="Copperbelt" value={form.shippingState} onChange={e=>set('shippingState',e.target.value)} />
                </div>
              </div>

              <div className="form-row">
                <div className="input-group">
                  <label className="input-label">ZIP / Postal Code</label>
                  <input className="input-field" placeholder="10001" value={form.shippingZip} onChange={e=>set('shippingZip',e.target.value)} />
                </div>
                <div className="input-group">
                  <label className="input-label">Country</label>
                  <select className="input-field" value={form.shippingCountry} onChange={e=>set('shippingCountry',e.target.value)}>
                    {COUNTRIES.map(c=><option key={c}>{c}</option>)}
                  </select>
                </div>
              </div>

              {/* Special delivery note */}
              <div className="input-group">
                <label className="input-label">Special Delivery Instructions</label>
                <textarea className="input-field" rows={2} style={{resize:'vertical',fontFamily:'var(--raleway)'}} placeholder="e.g. Ring bell twice, leave at reception, call before arrival, available after 5pm…" value={form.deliveryNote} onChange={e=>set('deliveryNote',e.target.value)} />
              </div>

              {/* Summary preview */}
              {(form.shippingAddress||form.shippingCity) && (
                <div style={{background:'rgba(46,139,87,0.08)',border:'1px solid var(--border)',padding:'0.8rem',marginTop:'0.5rem',fontSize:'0.75rem',color:'var(--text-muted)',lineHeight:1.7}}>
                  📍 <strong style={{color:'var(--copper-light)'}}>Delivering to:</strong> {[form.shippingRecipient,form.shippingAddress,form.landmark&&`(${form.landmark})`,form.shippingCity,form.shippingState,form.shippingZip,form.shippingCountry].filter(Boolean).join(', ')}
                  {form.shippingPhone && <div style={{marginTop:'0.3rem'}}>📞 {form.shippingPhone}</div>}
                  {form.deliveryNote && <div style={{marginTop:'0.3rem'}}>🗒️ {form.deliveryNote}</div>}
                </div>
              )}
            </div>

            <button className="btn btn-primary" style={{width:'100%',padding:'1rem'}} onClick={()=>setStep(2)}>Continue to Payment →</button>
          </>
        )}

        {step === 2 && (
          <>
            <div className="modal-title">Payment Method</div>
            <div className="modal-sub">All transactions are 256-bit encrypted & secured</div>
            {payErrors.method && <div style={{background:'rgba(229,62,62,0.1)',border:'1px solid rgba(229,62,62,0.3)',padding:'0.6rem 1rem',color:'#FC8181',fontSize:'0.78rem',marginBottom:'1rem',borderRadius:'2px'}}>⚠️ {payErrors.method}</div>}
            <div className="payment-methods">
              {paymentOptions.map(opt => (
                <div key={opt.id} className={`payment-option ${payMethod===opt.id?'selected':''}`} onClick={()=>{setPayMethod(opt.id);setPayErrors({});}}>
                  <span className="payment-icon">{opt.icon}</span>
                  <div><div className="payment-name">{opt.name}</div><div className="payment-sub">{opt.sub}</div></div>
                  {payMethod===opt.id && <span style={{marginLeft:'auto',color:'var(--copper-glow)',fontSize:'1rem'}}>✓</span>}
                </div>
              ))}
            </div>
            {(payMethod==='credit'||payMethod==='debit') && (
              <div style={{borderTop:'1px solid var(--border)',paddingTop:'1rem'}}>
                <div className="input-group"><label className="input-label">Cardholder Name</label><input className="input-field" style={payErrors.cardName?{borderColor:'#e53e3e'}:{}} placeholder="John Doe" value={form.cardName} onChange={e=>set('cardName',e.target.value)} />{payErrors.cardName&&<div style={{color:'#FC8181',fontSize:'0.68rem',marginTop:'0.3rem'}}>⚠️ {payErrors.cardName}</div>}</div>
                <div className="input-group"><label className="input-label">Card Number</label><input className="input-field" style={payErrors.cardNumber?{borderColor:'#e53e3e'}:{}} placeholder="4242 4242 4242 4242" value={form.cardNumber} onChange={e=>set('cardNumber',formatCard(e.target.value))} maxLength={19} />{payErrors.cardNumber&&<div style={{color:'#FC8181',fontSize:'0.68rem',marginTop:'0.3rem'}}>⚠️ {payErrors.cardNumber}</div>}</div>
                <div className="form-row">
                  <div className="input-group"><label className="input-label">Expiry (MM/YY)</label><input className="input-field" style={payErrors.cardExpiry?{borderColor:'#e53e3e'}:{}} placeholder="MM/YY" value={form.cardExpiry} onChange={e=>set('cardExpiry',formatExpiry(e.target.value))} maxLength={5} />{payErrors.cardExpiry&&<div style={{color:'#FC8181',fontSize:'0.68rem',marginTop:'0.3rem'}}>⚠️ {payErrors.cardExpiry}</div>}</div>
                  <div className="input-group"><label className="input-label">CVC / CVV</label><input className="input-field" style={payErrors.cardCvc?{borderColor:'#e53e3e'}:{}} placeholder="123" value={form.cardCvc} onChange={e=>set('cardCvc',e.target.value.replace(/\D/g,'').slice(0,4))} />{payErrors.cardCvc&&<div style={{color:'#FC8181',fontSize:'0.68rem',marginTop:'0.3rem'}}>⚠️ {payErrors.cardCvc}</div>}</div>
                </div>
                <div className="input-group"><label className="input-label">Billing Address</label><input className="input-field" placeholder="123 Main Street" value={form.billingAddress} onChange={e=>set('billingAddress',e.target.value)} /></div>
              </div>
            )}
            {payMethod==='paypal' && <div className="input-group" style={{borderTop:'1px solid var(--border)',paddingTop:'1rem'}}><label className="input-label">PayPal Email</label><input className="input-field" style={payErrors.paypalEmail?{borderColor:'#e53e3e'}:{}} type="email" placeholder="you@paypal.com" value={form.paypalEmail} onChange={e=>set('paypalEmail',e.target.value)} />{payErrors.paypalEmail&&<div style={{color:'#FC8181',fontSize:'0.68rem',marginTop:'0.3rem'}}>⚠️ {payErrors.paypalEmail}</div>}</div>}
            {(payMethod==='googlepay'||payMethod==='applepay') && (
              <div style={{textAlign:'center',padding:'1.5rem',background:'rgba(255,255,255,0.03)',border:'1px solid var(--border)',marginBottom:'1rem',borderTop:'none'}}>
                <div style={{fontSize:'3rem',marginBottom:'0.8rem'}}>{payMethod==='googlepay'?'🟢':'🍎'}</div>
                <div style={{fontSize:'0.85rem',color:'var(--text-muted)',marginBottom:'0.3rem'}}>Authenticate with {payMethod==='googlepay'?'Google':'Apple'} Pay</div>
                <div style={{fontSize:'0.72rem',color:'var(--text-dim)'}}>You'll complete biometric verification on payment</div>
              </div>
            )}
            {payMethod==='mobilemoney' && (
              <div style={{borderTop:'1px solid var(--border)',paddingTop:'1rem'}}>
                <div style={{marginBottom:'1rem'}}><label className="input-label" style={{display:'block',marginBottom:'0.6rem'}}>Mobile Money Provider</label><div className="mm-logos">{mmProviders.map(p=><div key={p} className={`mm-logo ${mmProvider===p?'selected':''}`} onClick={()=>setMmProvider(p)}>{p}</div>)}</div>{payErrors.mmProvider&&<div style={{color:'#FC8181',fontSize:'0.68rem',marginTop:'0.3rem'}}>⚠️ {payErrors.mmProvider}</div>}</div>
                <div className="input-group"><label className="input-label">Mobile Number</label><PhonePicker value={form.mmPhone} onChange={v=>set('mmPhone',v)} countryCode={phoneCode} onCountryCodeChange={setPhoneCode} />{payErrors.mmPhone&&<div style={{color:'#FC8181',fontSize:'0.68rem',marginTop:'0.3rem'}}>⚠️ {payErrors.mmPhone}</div>}</div>
                <div className="input-group"><label className="input-label">Registered Name</label><input className="input-field" style={payErrors.mmName?{borderColor:'#e53e3e'}:{}} placeholder="Name on account" value={form.mmName} onChange={e=>set('mmName',e.target.value)} />{payErrors.mmName&&<div style={{color:'#FC8181',fontSize:'0.68rem',marginTop:'0.3rem'}}>⚠️ {payErrors.mmName}</div>}</div>
              </div>
            )}
            {payMethod==='banktransfer' && (
              <div style={{borderTop:'1px solid var(--border)',paddingTop:'1rem'}}>
                <div className="input-group"><label className="input-label">Bank Name</label><input className="input-field" style={payErrors.bankName?{borderColor:'#e53e3e'}:{}} placeholder="Your bank" value={form.bankName} onChange={e=>set('bankName',e.target.value)} />{payErrors.bankName&&<div style={{color:'#FC8181',fontSize:'0.68rem',marginTop:'0.3rem'}}>⚠️ {payErrors.bankName}</div>}</div>
                <div className="input-group"><label className="input-label">Account Number / IBAN</label><input className="input-field" style={payErrors.accountNumber?{borderColor:'#e53e3e'}:{}} placeholder="GB29 NWBK 6016 1331 9268 19" value={form.accountNumber} onChange={e=>set('accountNumber',e.target.value)} />{payErrors.accountNumber&&<div style={{color:'#FC8181',fontSize:'0.68rem',marginTop:'0.3rem'}}>⚠️ {payErrors.accountNumber}</div>}</div>
                <div className="input-group"><label className="input-label">Sort Code / SWIFT / BIC</label><input className="input-field" style={payErrors.sortCode?{borderColor:'#e53e3e'}:{}} placeholder="60-16-13" value={form.sortCode} onChange={e=>set('sortCode',e.target.value)} />{payErrors.sortCode&&<div style={{color:'#FC8181',fontSize:'0.68rem',marginTop:'0.3rem'}}>⚠️ {payErrors.sortCode}</div>}</div>
              </div>
            )}
            <div style={{display:'flex',gap:'0.8rem',marginTop:'1.5rem'}}>
              <button className="btn btn-ghost" onClick={()=>setStep(1)}>← Back</button>
              <button className="btn btn-primary" style={{flex:1,padding:'1rem'}} onClick={handlePay} disabled={processing||!payMethod}>
                {processing ? <span>⏳ Processing payment...</span> : <span>🔒 Pay {fmt(total,listing.currency)}</span>}
              </button>
            </div>
            <div style={{textAlign:'center',marginTop:'0.8rem',fontSize:'0.68rem',color:'var(--text-dim)'}}>🔒 256-bit SSL Encryption · PCI DSS Level 1 · MICO Buyer Protection</div>
          </>
        )}

        {step === 3 && order && (
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:'5rem',marginBottom:'1rem',animation:'pulse 1s ease'}}>🎉</div>
            <div className="modal-title" style={{marginBottom:'0.5rem',textAlign:'center'}}>Order Confirmed!</div>
            <div style={{color:'var(--success)',fontFamily:'var(--cinzel)',fontSize:'1.1rem',marginBottom:'1.5rem'}}>✓ Payment Successful</div>
            <div style={{background:'rgba(46,139,87,0.08)',border:'1px solid var(--border-bright)',padding:'1.5rem',marginBottom:'1.5rem',textAlign:'left'}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.6rem'}}><span style={{color:'var(--text-dim)',fontSize:'0.78rem'}}>Order ID</span><span style={{fontFamily:'var(--cinzel)',color:'var(--copper-light)'}}>{order.id}</span></div>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.6rem'}}><span style={{color:'var(--text-dim)',fontSize:'0.78rem'}}>Amount Paid</span><span style={{fontFamily:'var(--cinzel)',color:'var(--copper-glow)',fontWeight:700}}>{fmt(order.amount,order.currency)}</span></div>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.6rem'}}><span style={{color:'var(--text-dim)',fontSize:'0.78rem'}}>Tracking Ref</span><span style={{fontFamily:'var(--cinzel)',color:'var(--copper-light)',fontSize:'0.82rem'}}>{order.tracking}</span></div>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.6rem'}}><span style={{color:'var(--text-dim)',fontSize:'0.78rem'}}>Est. Delivery</span><span style={{color:'var(--success)',fontSize:'0.82rem'}}>{order.estimatedDelivery}</span></div>
              {form.shippingCity && <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.6rem'}}><span style={{color:'var(--text-dim)',fontSize:'0.78rem'}}>Deliver to</span><span style={{fontSize:'0.78rem',textAlign:'right',maxWidth:'55%',lineHeight:1.5}}>{[form.shippingRecipient,form.shippingAddress,form.shippingCity,form.shippingCountry].filter(Boolean).join(', ')}</span></div>}
              {form.shippingPhone && <div style={{display:'flex',justifyContent:'space-between'}}><span style={{color:'var(--text-dim)',fontSize:'0.78rem'}}>Contact</span><span style={{fontSize:'0.78rem'}}>{form.shippingPhone}</span></div>}
            </div>
            {/* Order Steps */}
            <div className="order-steps" style={{marginBottom:'1.5rem'}}>
              {['Ordered','Confirmed','Processing','Shipped','Delivered'].map((s,i)=>(
                <div key={s} className={`order-step ${i<2?'done':i===2?'active':''}`}>
                  <div className="order-step-dot">{i<2?'✓':i+1}</div>
                  <div className="order-step-label">{s}</div>
                </div>
              ))}
            </div>
            <button className="btn btn-primary" style={{width:'100%'}} onClick={onClose}>Continue Shopping →</button>
          </div>
        )}
      </div>
    </div>
  );
}

// CREATE LISTING MODAL
// =========================================================
function CreateListingModal() {
  const {user, setModal, addListing, setPage, addToast} = useApp();
  const [form, setForm] = useState({
    title:'', category:'Electronics', condition:'New', type:'buyNow',
    price:'', buyNow:'', description:'', location: user?.country||'',
    currency:'USD', shipping:'', duration:'7', emoji: '📦',
  });
  const [imagePreview, setImagePreview] = useState(null);
  const [err, setErr] = useState('');
  const [step, setStep] = useState(1);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const fileRef = useRef();
  const emojis = ['📱','💻','📷','🎮','⌚','👟','👜','🏠','🚗','🎸','💍','🖼️','📚','🌿','🎨','🏺','🧴','🎒','🏋️','🍷','✨','🎵','🧸','🔨','🍵'];

  const handleImageUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 15*1024*1024) { addToast('Image too large (max 15MB)','error'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => setImagePreview(ev.target.result);
    reader.readAsDataURL(file);
  };

  const handleSubmit = () => {
    if (!form.title || !form.price || !form.description) { setErr('Please fill all required fields (title, price, description)'); return; }
    if (parseFloat(form.price) <= 0) { setErr('Price must be greater than 0'); return; }
    const listing = {
      ...form,
      price: parseFloat(form.price),
      buyNow: form.buyNow ? parseFloat(form.buyNow) : (form.type==='buyNow'?parseFloat(form.price):null),
      shipping: form.shipping !== '' ? parseFloat(form.shipping) : 0,
      timeLeft: `${form.duration}d`,
      userImage: imagePreview || null,
      imageUrl: imagePreview || null,
      rating: user.rating || 5.0,
      ratingCount: user.ratingCount || 0,
      sellerRating: user.rating || 5.0,
      sellerSales: user.ratingCount || 0,
    };
    addListing(listing);
    setModal(null);
    setPage('mylistings');
  };

  const pricePrev = form.price ? parseFloat(form.price) : 0;

  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setModal(null);}}>
      <div className="modal modal-wide" style={{maxHeight:'92vh',overflowY:'auto'}}>
        <button className="modal-close" onClick={()=>setModal(null)}>✕</button>
        <div className="modal-title">List an Item for Sale</div>
        <div className="modal-sub">Free to list — MICO takes 15% commission only when your item sells</div>

        {/* Step tabs */}
        <div style={{display:'flex',borderBottom:'1px solid var(--border)',marginBottom:'1.5rem'}}>
          {['Photos & Details','Pricing & Shipping'].map((s,i)=>(
            <div key={s} onClick={()=>setStep(i+1)} style={{flex:1,padding:'0.6rem',textAlign:'center',fontSize:'0.72rem',letterSpacing:'0.1em',textTransform:'uppercase',cursor:'pointer',color:step===i+1?'var(--copper-light)':'var(--text-dim)',borderBottom:`2px solid ${step===i+1?'var(--copper)':'transparent'}`,marginBottom:'-1px'}}>
              {i+1}. {s}
            </div>
          ))}
        </div>

        {step === 1 && (
          <>
            <input type="file" ref={fileRef} accept="image/*" style={{display:'none'}} onChange={handleImageUpload} />
            {imagePreview ? (
              <div style={{marginBottom:'1.2rem',position:'relative'}}>
                <img src={imagePreview} alt="Preview" style={{width:'100%',height:220,objectFit:'cover',border:'1px solid var(--border)'}} />
                <button className="btn btn-ghost btn-xs" style={{position:'absolute',top:'0.5rem',right:'0.5rem'}} onClick={()=>setImagePreview(null)}>✕ Remove</button>
                <div style={{position:'absolute',bottom:'0.5rem',left:'0.5rem',background:'rgba(0,0,0,0.8)',padding:'0.2rem 0.5rem',fontSize:'0.65rem',color:'var(--success)'}}>✓ Photo uploaded</div>
              </div>
            ) : (
              <div className="upload-zone" onClick={()=>fileRef.current?.click()}>
                <div className="upload-icon">📸</div>
                <div className="upload-text">Click to upload product photo</div>
                <div style={{fontSize:'0.7rem',color:'var(--text-dim)',marginTop:'0.5rem'}}>JPG, PNG, WEBP up to 15MB · Real photos get 3× more views</div>
              </div>
            )}
            <div style={{marginBottom:'1rem'}}>
              <label className="input-label">Item Emoji Icon</label>
              <div style={{display:'flex',gap:'0.4rem',flexWrap:'wrap'}}>
                {emojis.map(e=>(
                  <div key={e} onClick={()=>set('emoji',e)} style={{fontSize:'1.4rem',padding:'0.35rem',cursor:'pointer',border:`1px solid ${form.emoji===e?'var(--copper)':'var(--border)'}`,background:form.emoji===e?'rgba(46,139,87,0.15)':'rgba(255,255,255,0.02)',transition:'all 0.15s'}}>{e}</div>
                ))}
              </div>
            </div>
            <div className="input-group"><label className="input-label">Item Title *</label><input className="input-field" placeholder="Describe your item clearly (e.g. iPhone 15 Pro Max 256GB Sealed)" value={form.title} onChange={e=>set('title',e.target.value)} maxLength={100} /><div style={{fontSize:'0.65rem',color:'var(--text-dim)',marginTop:'0.3rem'}}>{form.title.length}/100 characters</div></div>
            <div className="form-row">
              <div className="input-group"><label className="input-label">Category *</label><select className="input-field" value={form.category} onChange={e=>set('category',e.target.value)}>{CATEGORIES.filter(c=>c!=='All').map(c=><option key={c}>{c}</option>)}</select></div>
              <div className="input-group"><label className="input-label">Condition *</label><select className="input-field" value={form.condition} onChange={e=>set('condition',e.target.value)}>{['New','Like New','New with tags','Excellent','Good','Fair','For parts/repair'].map(c=><option key={c}>{c}</option>)}</select></div>
            </div>
            <div className="input-group"><label className="input-label">Description *</label><textarea className="input-field" rows={5} placeholder="Describe your item thoroughly: brand, model, specs, condition details, what's included, any defects..." value={form.description} onChange={e=>set('description',e.target.value)} /></div>
            <button className="btn btn-primary" style={{width:'100%'}} onClick={()=>setStep(2)}>Next: Pricing & Shipping →</button>
          </>
        )}

        {step === 2 && (
          <>
            <div className="form-row">
              <div className="input-group"><label className="input-label">Listing Type</label><select className="input-field" value={form.type} onChange={e=>set('type',e.target.value)}><option value="buyNow">Buy Now (Fixed Price)</option><option value="auction">Auction</option></select></div>
              <div className="input-group"><label className="input-label">Listing Duration</label><select className="input-field" value={form.duration} onChange={e=>set('duration',e.target.value)}>{['1','3','5','7','10','14','21','30'].map(d=><option key={d} value={d}>{d} days</option>)}</select></div>
            </div>
            <div className="form-row">
              <div className="input-group"><label className="input-label">{form.type==='auction'?'Starting Bid *':'Buy Now Price *'}</label><input className="input-field" type="number" min="0.01" step="0.01" placeholder="0.00" value={form.price} onChange={e=>set('price',e.target.value)} /></div>
              <div className="input-group"><label className="input-label">Currency</label><select className="input-field" value={form.currency} onChange={e=>set('currency',e.target.value)}>{Object.keys(CURRENCIES).map(c=><option key={c}>{c}</option>)}</select></div>
            </div>
            {form.type==='auction' && (
              <div className="input-group"><label className="input-label">Buy It Now Price (optional)</label><input className="input-field" type="number" min="0.01" placeholder="Allow instant buy at this price" value={form.buyNow} onChange={e=>set('buyNow',e.target.value)} /></div>
            )}
            <div className="form-row">
              <div className="input-group"><label className="input-label">Shipping Cost (0 = Free)</label><input className="input-field" type="number" min="0" step="0.01" placeholder="0.00" value={form.shipping} onChange={e=>set('shipping',e.target.value)} /></div>
              <div className="input-group"><label className="input-label">Item Location / Ships From</label><input className="input-field" placeholder="City, Country" value={form.location} onChange={e=>set('location',e.target.value)} /></div>
            </div>
            {pricePrev > 0 && (
              <div className="commission-badge" style={{marginBottom:'1.5rem'}}>
                💰 At {fmt(pricePrev,form.currency)}: You receive <strong>{fmt(pricePrev*(1-COMMISSION),form.currency)}</strong> · Commission: <strong>{fmt(pricePrev*COMMISSION,form.currency)}</strong> (15%)
              </div>
            )}
            {err && <div style={{color:'var(--error)',fontSize:'0.8rem',marginBottom:'1rem',padding:'0.6rem',background:'rgba(229,62,62,0.1)',border:'1px solid rgba(229,62,62,0.3)'}}>⚠️ {err}</div>}
            <div style={{display:'flex',gap:'0.8rem'}}>
              <button className="btn btn-ghost" style={{flex:1}} onClick={()=>setStep(1)}>← Back</button>
              <button className="btn btn-primary" style={{flex:2}} onClick={handleSubmit}>🚀 Publish Listing</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}
